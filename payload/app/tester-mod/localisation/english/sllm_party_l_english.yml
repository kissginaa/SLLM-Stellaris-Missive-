 sllm_party_cheer:0 "Afterglow of the House Party"
 sllm_party_cheer_desc:0 "The ruler opened the residence to friends and colleagues for a night off the record. The good mood lingers."
 sllm_party_resolve:0 "One Last Night Together"
 sllm_party_resolve_desc:0 "A party held in dark times, before the fighting resumes. Everyone remembers what they are fighting for."
 sllm_party_guest_goodwill:0 "Fond Memories of a House Party"
 sllm_party_guest_goodwill_desc:0 "One of their leaders was a guest at our ruler's private house party and went home with good stories."
