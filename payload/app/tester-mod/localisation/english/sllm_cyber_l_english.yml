l_english:
 sllm_cyber_situation:0 "Foreign Disinformation Campaign"
 sllm_cyber_situation_type:0 "Foreign Disinformation Campaign"
 sllm_cyber_situation_desc:0 "Another empire's agents are flooding our networks with fabricated outrage, defeatist rumours and slander against our government. Accounts with foreign addresses multiply on every board.\n\nIf the campaign runs its course, public opinion will be theirs to steer for a year. Choose how we answer it."
 sllm_cyber_situation_monthly_change_tooltip:0 "The campaign spreads on its own unless we answer it. Deploying Cyber Command, a diplomatic protest or a counter-operation pushes it back."
 sllm_cyber_stage_1:0 "Suspicious Posts"
 sllm_cyber_stage_1_desc:0 "A few odd accounts and copy-pasted posts. Most citizens have not noticed yet."
 sllm_cyber_stage_2:0 "Spreading"
 sllm_cyber_stage_2_desc:0 "The rumours are trending. Arguments break out on every board."
 sllm_cyber_stage_3:0 "Public Opinion Under Siege"
 sllm_cyber_stage_3_desc:0 "Foreign narratives dominate the conversation. Trust in the government is collapsing."
 sllm_cyber_ap_ignore:0 "Ignore It"
 sllm_cyber_ap_ignore_desc:0 "Costs nothing. The campaign keeps spreading."
 sllm_cyber_ap_cmd:0 "Deploy Cyber Command"
 sllm_cyber_ap_cmd_desc:0 "Takes down the foreign accounts quickly. Some citizens will call it censorship."
 sllm_cyber_ap_protest:0 "Diplomatic Protest"
 sllm_cyber_ap_protest_desc:0 "Confront the empire behind it. Pushes the campaign back slowly; their opinion of us drops."
 sllm_cyber_ap_counter:0 "Counter-Operation"
 sllm_cyber_ap_counter_desc:0 "Answer in kind with our own operatives. Slowly pushes the campaign back while we strike at theirs."
 sllm_cyber_mp_cmd:0 "Cyber Command takedowns"
 sllm_cyber_mp_protest:0 "Diplomatic pressure"
 sllm_cyber_mp_counter:0 "Counter-operation"
 sllm_cyber_lost_tt:0 "Public opinion falls under foreign influence: §R-5 Stability§! on all planets for a year."
 sllm_cyber_repelled_tt:0 "The campaign is beaten back and the foreign accounts vanish."
 sllm_cyber_dominated:0 "Public Opinion Hijacked"
 sllm_cyber_dominated_desc:0 "A foreign disinformation campaign has taken over our public conversation."
 sllm_cyber_protested:0 "Protested Our Interference"
 sllm_cyber_meddled:0 "Meddled in Our Networks"
 sllm_cyber_mp_won:0 "Galactic Tribunal guilty verdict"
 sllm_cyber_mp_lost:0 "Our case was thrown out of court"
 sllm_cyber_convicted:0 "Convicted of Disinformation"
