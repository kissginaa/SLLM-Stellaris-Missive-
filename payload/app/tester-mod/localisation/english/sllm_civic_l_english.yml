l_english:
 sllm_referendum_mandate:0 "Popular Mandate"
 sllm_referendum_mandate_desc:0 "The people approved the government's policy in a referendum. The government acts with the nation behind it."
 sllm_referendum_defied:0 "Defied Referendum"
 sllm_referendum_defied_desc:0 "The government forced through a policy the people rejected at the ballot box. Trust in the state has been shaken."
 sllm_amnesty_petty:0 "Petty-Offence Pardon"
 sllm_amnesty_petty_desc:0 "Minor offenders were pardoned on a national occasion. The public welcomes the gesture, though petty crime ticks up."
 sllm_amnesty_general:0 "General Pardon"
 sllm_amnesty_general_desc:0 "A broad pardon emptied many cells. Families celebrate, but the streets are less orderly."
 sllm_amnesty_grand:0 "Grand Amnesty"
 sllm_amnesty_grand_desc:0 "A sweeping amnesty freed prisoners across the empire. Gratitude runs high, and so does crime."
 sllm_amnesty_pol_up:0 "Political Prisoners Freed"
 sllm_amnesty_pol_up_desc:0 "Our comrades have been released from prison. The faction approves of the government."
 sllm_amnesty_pol_down:0 "Dissidents Released"
 sllm_amnesty_pol_down_desc:0 "The government released dissidents the faction wanted locked up. The faction is angered."
