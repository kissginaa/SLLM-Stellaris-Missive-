l_english:
 sllm_trait_married_commander:0 "Married (Commander)"
 sllm_trait_married_commander_desc:0 "Married to a fellow leader of the empire and steadier for it. Damage of the fleet and armies they command is increased by 10%."
 sllm_trait_widowed_grief_commander:0 "Grief of Loss (Commander)"
 sllm_trait_widowed_grief_commander_desc:0 "Has not recovered from losing their spouse. Damage of the fleet and armies they command is reduced by 10%."
 sllm_trait_married_official:0 "Married (Official)"
 sllm_trait_married_official_desc:0 "Married to a fellow leader of the empire and steadier for it. Job output on the planet they govern is increased by 10%."
 sllm_trait_widowed_grief_official:0 "Grief of Loss (Official)"
 sllm_trait_widowed_grief_official_desc:0 "Has not recovered from losing their spouse. Job output on the planet they govern is reduced by 10%."
 sllm_trait_married_scientist:0 "Married (Scientist)"
 sllm_trait_married_scientist_desc:0 "Married to a fellow leader of the empire and steadier for it. Survey and anomaly research speed is increased by 10%. On the council, research speed also rises by 10%."
 sllm_trait_widowed_grief_scientist:0 "Grief of Loss (Scientist)"
 sllm_trait_widowed_grief_scientist_desc:0 "Has not recovered from losing their spouse. Survey and anomaly research speed is reduced by 10%. On the council, research speed also drops by 10%."
 sllm_trait_widowed_heartbroken:0 "Heartbroken"
 sllm_trait_widowed_heartbroken_desc:0 "Since losing their spouse, nothing seems to hold their interest. Leader experience gain is reduced by 25%."
