l_english:
 planet_automation_sllm_governor:0 "Governor's Mandate"
 planet_automation_sllm_governor_desc:0 "Builds this planet's buildings, districts and zones by the mandate you handed its governor in SLLM (office → Planetary governors → Entrust planets).\n\nPauses when the treasury runs low, depending on the governor's temper. Planets without a mandate are left alone."
 sllm_gov_mandate_research:0 "Governor's Mandate: Research"
 sllm_gov_mandate_research_desc:0 "The governor runs this planet by the Research mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_foundry:0 "Governor's Mandate: Alloys"
 sllm_gov_mandate_foundry_desc:0 "The governor runs this planet by the Alloys mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_factory:0 "Governor's Mandate: Consumer goods"
 sllm_gov_mandate_factory_desc:0 "The governor runs this planet by the Consumer goods mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_mining:0 "Governor's Mandate: Mining"
 sllm_gov_mandate_mining_desc:0 "The governor runs this planet by the Mining mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_generator:0 "Governor's Mandate: Energy"
 sllm_gov_mandate_generator_desc:0 "The governor runs this planet by the Energy mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_farming:0 "Governor's Mandate: Farming"
 sllm_gov_mandate_farming_desc:0 "The governor runs this planet by the Farming mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_urban:0 "Governor's Mandate: Urban & trade"
 sllm_gov_mandate_urban_desc:0 "The governor runs this planet by the Urban & trade mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_fortress:0 "Governor's Mandate: Fortress"
 sllm_gov_mandate_fortress_desc:0 "The governor runs this planet by the Fortress mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_temper_frugal:0 "Careful Governor"
 sllm_gov_temper_frugal_desc:0 "The governor counts every mineral. Buildings cost a little less."
 sllm_gov_temper_bold:0 "Bold Governor"
 sllm_gov_temper_bold_desc:0 "The governor pushes the crews hard. Buildings go up faster."
 sllm_gov_veteran:0 "Seasoned Governor"
 sllm_gov_veteran_desc:0 "A year into the mandate, the governor knows this planet inside out. Construction is quicker and every job produces a little more."
 sllm_gov.10.name:0 "A Governor's Mandate for [Root.GetName]"
 sllm_gov.10.desc:0 "§H[sllm_gov_face.GetName]§!, governor of [Root.GetName], bows to the screen.\n\n\"Understood. From today [Root.GetName] is a §Y[Root.sllm_gov_mandate_now]§! world. I will see to the construction myself, one project at a time.\"\n\n[Root.sllm_gov_temper_say]"
 sllm_gov.10.a:0 "It is in your hands."
 sllm_gov.11.name:0 "A Seasoned Hand on [Root.GetName]"
 sllm_gov.11.desc:0 "§H[sllm_gov_face.GetName]§! sends a short report from [Root.GetName].\n\n\"It has been a year since you gave me this world. I stumbled at first, but I could plan its next build with my eyes closed now.\"\n\nThe governor is now §YSeasoned§!: construction is quicker and every job produces a little more."
 sllm_gov.11.a:0 "Well done."
 sllm_gov_mname_research:0 "Research"
 sllm_gov_mname_foundry:0 "Alloys"
 sllm_gov_mname_factory:0 "Consumer goods"
 sllm_gov_mname_mining:0 "Mining"
 sllm_gov_mname_generator:0 "Energy"
 sllm_gov_mname_farming:0 "Farming"
 sllm_gov_mname_urban:0 "Urban & trade"
 sllm_gov_mname_fortress:0 "Fortress"
 sllm_gov_mname_none:0 "self-managed"
 sllm_gov_tsay_frugal:0 "\"But if the treasury drops below 1,000 minerals I will pause. Building on debt is not my way.\""
 sllm_gov_tsay_normal:0 "\"If the treasury drops below 300 minerals I will hold off for a while.\""
 sllm_gov_tsay_bold:0 "\"I will push ahead whatever the stockpile says — until you tell me to stop.\""
 sllm_gov_mname_unity:0 "Unity"
 sllm_gov_mname_trade:0 "Trade"
 sllm_gov_mandate_unity:0 "Governor's Mandate: Unity"
 sllm_gov_mandate_unity_desc:0 "The governor runs this planet by the Unity mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_gov_mandate_trade:0 "Governor's Mandate: Trade"
 sllm_gov_mandate_trade_desc:0 "The governor runs this planet by the Trade mandate you handed over in SLLM. Construction moves faster and the mandate's workers produce a little more."
 sllm_quota_p0:0 "Planetary Quota: Preparation"
 sllm_quota_p0_desc:0 "A quota has been levied on this world through SLLM. The governor is laying the groundwork, and the people already grumble."
 sllm_quota_p1:0 "Planetary Quota: Phase 1"
 sllm_quota_p1_desc:0 "The first phase of the quota is underway. Every job works harder for the realm, and the people feel the weight of it."
 sllm_quota_p2:0 "Planetary Quota: Phase 2"
 sllm_quota_p2_desc:0 "The second phase of the quota. Output climbs, and so does the resentment."
 sllm_quota_p3:0 "Planetary Quota: Phase 3"
 sllm_quota_p3_desc:0 "The final phase of the quota. The world strains at its limit; the end is in sight."
 sllm_quota_done:0 "Quota Fulfilled"
 sllm_quota_done_desc:0 "The quota is complete and the last shipments have left. Relief spreads across the world."
 sllm_quota_fail:0 "Broken Quota"
 sllm_quota_fail_desc:0 "The quota collapsed under unrest. The people remember being pushed for nothing."
