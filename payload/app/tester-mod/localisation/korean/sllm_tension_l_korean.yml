l_korean:
 sllm_tension:0 "대립 긴장도"
 sllm_tension_type:0 "대립 긴장도"
 sllm_tension_desc:0 "은하는 [sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName]을(를) 지켜보고 있습니다. 국경에 모이는 함대, 국경 사건, 거친 말은 둘 사이의 긴장을 높이고, 조용한 달은 긴장을 식힙니다.\n\n100이 되면 양쪽 모두 서로에 대한 전쟁 명분을 얻습니다."
 sllm_tension_monthly_change_tooltip:0 "매달 저절로 조금씩 식습니다. 상대 국경에 모이는 군함, 국경 사건, 외교 위기가 긴장을 높입니다."
 sllm_tn_stage_0:0 "평온"
 sllm_tn_stage_0_desc:0 "사이는 껄끄럽지만 전쟁을 예상하는 이는 없습니다."
 sllm_tn_stage_1:0 "냉랭"
 sllm_tn_stage_1_desc:0 "대사들이 차가운 말을 주고받습니다. 상인들이 불안해합니다."
 sllm_tn_stage_2:0 "위기"
 sllm_tn_stage_2_desc:0 "50부터: 두 세력이 서로를 훨씬 나쁘게 봅니다. 75부터: 양쪽이 동원합니다(함대 한도 +20, 함선 유지비 +10%)."
 sllm_tn_stage_3:0 "일촉즉발"
 sllm_tn_stage_3_desc:0 "90부터: 안정도가 떨어지고 관계가 더 나빠집니다. 100: 양쪽 모두 서로에 대한 전쟁 명분을 얻습니다."
 sllm_tn_watch:0 "예의 주시"
 sllm_tn_watch_desc:0 "이 막대는 두 세력 사이의 긴장을 보여 줄 뿐입니다. 막대를 움직이는 것은 우리의 외교입니다."
 sllm_tn_watch_tt:0 "여기서 고를 것은 없습니다. 막대는 시나리오가 관리합니다."
 sllm_tn_mobilized:0 "숙적과의 동원"
 sllm_tn_mobilized_desc:0 "숙적과의 긴장으로 나라 전체가 전시 체제에 들어갔습니다."
 sllm_tn_brink:0 "전쟁 직전"
 sllm_tn_brink_desc:0 "숙적과의 전쟁이 며칠 앞으로 다가온 듯합니다. 백성은 뭉치면서도 두려워합니다."
 sllm_tn_humbled:0 "결판에서 패배"
 sllm_tn_humbled_desc:0 "숙적과의 전쟁에서 졌습니다. 우리의 말은 무게를 잃었고 백성은 낙담했습니다."
 sllm_tn_crisis:0 "대립 위기"
 sllm_tn_brink_op:0 "전쟁 직전"
 cb_sllm_tn_showdown:0 "결판"
 cb_sllm_tn_showdown_desc:0 "숙적과의 긴장이 정점에 이르렀습니다."
 casus_belli_cb_sllm_tn_showdown:0 "결판"
 wg_sllm_tn_showdown:0 "결판"
 wg_sllm_tn_showdown_desc:0 "힘으로 대립을 끝냅니다. 진 쪽은 10년간 굴욕을 겪습니다."
 wg_sllm_tn_showdown_accept:0 "진 쪽은 10년간 굴욕을 겪습니다(영향력 −20%, 통합 −10%)."
 sllm_tn.ok:0 "예의 주시하겠다."
 sllm_tn.12.name:0 "거대 세력 간의 위기"
 sllm_tn.12.desc:0 "[sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName] 사이의 긴장이 50을 넘었습니다. 대사들은 서로를 비난하고, 두 정부는 상대를 적이라 부릅니다."
 sllm_tn.13.name:0 "동원령"
 sllm_tn.13.desc:0 "[sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName] 사이의 긴장이 75를 넘었습니다. 양쪽 모두 예비군을 소집했고 조선소는 밤낮없이 돌아갑니다."
 sllm_tn.14.name:0 "전쟁 직전"
 sllm_tn.14.desc:0 "[sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName] 사이의 긴장이 90을 넘었습니다. 최후통첩이 작성되고 있습니다. 불씨 하나면 전쟁입니다."
 sllm_tn.15.name:0 "마지막 자제가 무너지다"
 sllm_tn.15.desc:0 "[sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName] 사이의 긴장이 정점에 이르렀습니다. 이제 서로에 대한 전쟁 명분을 쥐었습니다. 전쟁이 날지는 그들에게 달렸습니다."
 sllm_tn.20.name:0 "긴장 완화"
 sllm_tn.20.desc:0 "[sllm_tn_a.GetName]와(과) [sllm_tn_b.GetName] 사이의 긴장이 조금 누그러졌습니다. 은하가 한숨 돌립니다."
