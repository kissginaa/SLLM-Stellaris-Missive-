l_korean:
 sllm_cyber_situation:0 "해외발 여론 공작"
 sllm_cyber_situation_type:0 "해외발 여론 공작"
 sllm_cyber_situation_desc:0 "다른 제국의 공작원들이 우리 인터넷을 꾸며 낸 분노, 패배주의 소문, 정부 비방으로 뒤덮고 있습니다. 게시판마다 해외 주소 계정이 늘어납니다.\n\n공작이 끝까지 퍼지면 1년 동안 우리 여론은 그들 손에 놀아납니다. 어떻게 맞설지 정하십시오."
 sllm_cyber_situation_monthly_change_tooltip:0 "대응하지 않으면 공작은 저절로 퍼집니다. 사이버 사령부 투입·외교 항의·역공작이 공작을 밀어냅니다."
 sllm_cyber_stage_1:0 "수상한 게시물"
 sllm_cyber_stage_1_desc:0 "이상한 계정 몇 개와 복사해 붙인 글들. 대부분의 시민은 아직 모릅니다."
 sllm_cyber_stage_2:0 "확산"
 sllm_cyber_stage_2_desc:0 "소문이 인기 글에 오르고 게시판마다 싸움이 벌어집니다."
 sllm_cyber_stage_3:0 "여론 포위"
 sllm_cyber_stage_3_desc:0 "외국발 이야기가 여론을 장악했습니다. 정부에 대한 신뢰가 무너지고 있습니다."
 sllm_cyber_ap_ignore:0 "무시"
 sllm_cyber_ap_ignore_desc:0 "비용은 없지만 공작은 계속 퍼집니다."
 sllm_cyber_ap_cmd:0 "사이버 사령부 투입"
 sllm_cyber_ap_cmd_desc:0 "해외 계정을 빠르게 걷어 냅니다. 일부 시민은 검열이라고 반발합니다."
 sllm_cyber_ap_protest:0 "외교 항의"
 sllm_cyber_ap_protest_desc:0 "배후 제국에 정식으로 항의합니다. 공작이 천천히 밀려나고, 그 제국의 우리 호감이 떨어집니다."
 sllm_cyber_ap_counter:0 "역공작"
 sllm_cyber_ap_counter_desc:0 "우리 공작원으로 맞받아칩니다. 공작을 천천히 밀어내면서 그들에게 반격합니다."
 sllm_cyber_mp_cmd:0 "사이버 사령부의 계정 삭제"
 sllm_cyber_mp_protest:0 "외교적 압박"
 sllm_cyber_mp_counter:0 "역공작"
 sllm_cyber_lost_tt:0 "여론이 외국 영향에 넘어갑니다: 1년간 모든 행성 §R안정도 -5§!."
 sllm_cyber_repelled_tt:0 "공작을 격퇴하고 해외 계정들이 사라집니다."
 sllm_cyber_dominated:0 "여론 장악당함"
 sllm_cyber_dominated_desc:0 "해외발 여론 공작이 우리 여론을 장악했습니다."
 sllm_cyber_protested:0 "공작 항의를 받음"
 sllm_cyber_meddled:0 "우리 인터넷을 공작함"
 sllm_cyber_mp_won:0 "은하재판소 유죄 판결"
 sllm_cyber_mp_lost:0 "제소 기각의 역풍"
 sllm_cyber_convicted:0 "여론 공작 유죄"
