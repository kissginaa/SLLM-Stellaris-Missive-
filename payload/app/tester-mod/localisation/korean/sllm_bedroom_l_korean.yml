l_korean:
 sllm_bedroom_comfort_1:0 "편안한 개인실"
 sllm_bedroom_comfort_1_desc:0 "잘 고른 가구 덕분에 통치자의 개인실이 쉴 수 있는 곳이 되었다."
 sllm_bedroom_comfort_2:0 "품위 있는 개인실"
 sllm_bedroom_comfort_2_desc:0 "취향 좋게 꾸민 개인실에서 푹 잔 통치자는 맑은 정신으로 일한다."
 sllm_bedroom_comfort_3:0 "호화로운 개인실"
 sllm_bedroom_comfort_3_desc:0 "고급 가구와 예술품이 통치자의 개인실을 채웠다. 통치자의 컨디션이 아주 좋다."
 sllm_bedroom_comfort_4:0 "궁전 같은 개인실"
 sllm_bedroom_comfort_4_desc:0 "통치자의 개인실은 제국 최고의 솜씨를 모아 놓은 곳이다. 잘 쉬고 영감을 얻은 통치자가 궁정 전체의 분위기를 이끈다."
