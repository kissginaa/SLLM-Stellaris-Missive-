l_korean:
 sllm_emp_1:0 "비상대권: 경계"
 sllm_emp_1_desc:0 "SLLM에서 선포한 비상대권으로 나라가 경계 태세입니다. 조선소와 주둔지가 더 빨리 돌아가고, 주민들은 불안해합니다."
 sllm_emp_2:0 "비상대권: 전시 체제"
 sllm_emp_2_desc:0 "나라가 전시 체제에 들어갔습니다. 함대는 더 맹렬히 싸우고 조선소는 쉬지 않지만, 일상은 고달파졌습니다."
 sllm_emp_3:0 "비상대권: 총동원"
 sllm_emp_3_desc:0 "모든 것을 전쟁에. 함대·조선소·지상군이 전력을 다하고, 그 값은 주민들이 치릅니다."
 sllm_emp_grip:0 "거두지 않은 비상대권"
 sllm_emp_grip_desc:0 "전쟁은 끝났는데 비상대권은 그대로입니다. 권력은 손아귀를 조이고, 신뢰는 빠져나갑니다."
 sllm_emp_return:0 "반납한 비상대권"
 sllm_emp_return_desc:0 "정부가 전쟁 뒤 비상대권을 스스로 내려놓았습니다. 주민들이 숨을 돌립니다."
