l_korean:
 sllm_trait_married_commander:0 "결혼함(지휘관)"
 sllm_trait_married_commander_desc:0 "같은 제국의 지도자와 결혼해 마음이 든든합니다. 지휘하는 함대·지상군의 피해가 10% 늘어납니다."
 sllm_trait_widowed_grief_commander:0 "사별의 슬픔(지휘관)"
 sllm_trait_widowed_grief_commander_desc:0 "배우자를 잃은 슬픔에서 벗어나지 못했습니다. 지휘하는 함대·지상군의 피해가 10% 줄어듭니다."
 sllm_trait_married_official:0 "결혼함(관료)"
 sllm_trait_married_official_desc:0 "같은 제국의 지도자와 결혼해 마음이 든든합니다. 맡은 행성의 직업 산출이 10% 늘어납니다."
 sllm_trait_widowed_grief_official:0 "사별의 슬픔(관료)"
 sllm_trait_widowed_grief_official_desc:0 "배우자를 잃은 슬픔에서 벗어나지 못했습니다. 맡은 행성의 직업 산출이 10% 줄어듭니다."
 sllm_trait_married_scientist:0 "결혼함(과학자)"
 sllm_trait_married_scientist_desc:0 "같은 제국의 지도자와 결혼해 마음이 든든합니다. 탐사·이상 현상 조사 속도가 10% 늘어납니다. 평의회에 있으면 연구 속도도 10% 늘어납니다."
 sllm_trait_widowed_grief_scientist:0 "사별의 슬픔(과학자)"
 sllm_trait_widowed_grief_scientist_desc:0 "배우자를 잃은 슬픔에서 벗어나지 못했습니다. 탐사·이상 현상 조사 속도가 10% 줄어듭니다. 평의회에 있으면 연구 속도도 10% 줄어듭니다."
 sllm_trait_widowed_heartbroken:0 "상실감"
 sllm_trait_widowed_heartbroken_desc:0 "배우자를 떠나보낸 뒤로 무엇에도 마음을 붙이지 못합니다. 지도자 경험치 획득이 25% 줄어듭니다."
