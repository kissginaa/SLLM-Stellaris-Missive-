l_korean:
 sllm_party_cheer:0 "관저 파티의 여운"
 sllm_party_cheer_desc:0 "통치자가 관저를 열어 동료들과 격식 없는 밤을 보냈습니다. 좋은 기분이 아직 남아 있습니다."
 sllm_party_resolve:0 "함께한 마지막 밤"
 sllm_party_resolve_desc:0 "어두운 시기, 다시 싸우러 나가기 전에 연 파티입니다. 모두 무엇을 위해 싸우는지 기억합니다."
 sllm_party_guest_goodwill:0 "관저 파티의 좋은 추억"
 sllm_party_guest_goodwill_desc:0 "그 나라 지도자가 우리 통치자의 사적인 관저 파티에 손님으로 왔다가 좋은 이야기를 잔뜩 안고 돌아갔습니다."
