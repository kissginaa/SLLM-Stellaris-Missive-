l_korean:
 sllm_audit_clean:0 "투명한 정부"
 sllm_audit_clean_desc:0 "정부가 국정감사에서 의혹을 성실히 해명했다. 국민은 정부를 믿는다."
 sllm_audit_scandal:0 "국정감사 파문"
 sllm_audit_scandal_desc:0 "국정감사에서 정부의 답변이 큰 논란을 불렀다. 신뢰가 무너지고 있다."
 sllm_audit_refused:0 "감사 거부"
 sllm_audit_refused_desc:0 "정부가 의회의 국정감사에 나서지 않았다. 국민은 정부가 무언가를 숨긴다고 믿는다."
