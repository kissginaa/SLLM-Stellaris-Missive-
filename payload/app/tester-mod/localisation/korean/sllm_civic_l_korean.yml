l_korean:
 sllm_referendum_mandate:0 "국민의 위임"
 sllm_referendum_mandate_desc:0 "국민이 국민투표로 정부의 정책을 승인했다. 정부는 국민을 등에 업고 움직인다."
 sllm_referendum_defied:0 "국민투표 거역"
 sllm_referendum_defied_desc:0 "정부가 국민이 투표로 거부한 정책을 강행했다. 국가에 대한 신뢰가 흔들렸다."
 sllm_amnesty_petty:0 "경범 사면"
 sllm_amnesty_petty_desc:0 "국가 기념일을 맞아 가벼운 죄를 지은 이들이 사면되었다. 시민들은 반기지만 경범죄는 조금 늘었다."
 sllm_amnesty_general:0 "일반 사면"
 sllm_amnesty_general_desc:0 "폭넓은 사면으로 많은 감방이 비었다. 가족들은 기뻐하지만 거리는 조금 어수선해졌다."
 sllm_amnesty_grand:0 "대사면"
 sllm_amnesty_grand_desc:0 "제국 전역의 죄수가 대사면으로 풀려났다. 감사의 목소리만큼 범죄도 늘었다."
 sllm_amnesty_pol_up:0 "정치범 석방"
 sllm_amnesty_pol_up_desc:0 "우리 동지들이 감옥에서 풀려났다. 파벌이 정부를 지지한다."
 sllm_amnesty_pol_down:0 "반체제 인사 석방"
 sllm_amnesty_pol_down_desc:0 "정부가 파벌이 가둬 두길 원한 반체제 인사들을 풀어 주었다. 파벌이 분노했다."
