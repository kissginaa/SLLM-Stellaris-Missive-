l_korean:
 sllm_vr_puppet:0 "종주국이 앉힌 통치자"
 sllm_vr_puppet_desc:0 "우리 통치자는 종주국 덕에 자리에 올랐고, 궁정을 종주국 뜻대로 다잡고 있습니다."
 sllm_vr_puppet_ours:0 "종주국의 총독"
 sllm_vr_puppet_ours_desc:0 "우리 통치자는 종주국이 보낸 그들의 관리입니다."
 sllm_vr_grudge:0 "궁정에 남은 폐위된 통치자"
 sllm_vr_grudge_desc:0 "종주국이 밀어낸 옛 통치자가 아직 궁정에 머물고, 원한도 함께 남아 있습니다."
 sllm_vr_meddle_1:0 "간섭에 대한 반감"
 sllm_vr_meddle_1_desc:0 "종주국이 우리 일에 손대는 것을 백성들이 못마땅해합니다."
 sllm_vr_meddle_2:0 "간섭에 대한 깊은 반감"
 sllm_vr_meddle_2_desc:0 "종주국의 잦은 간섭에 온 행성이 술렁입니다."
 sllm_vr_meddle_3:0 "간섭에 대한 분노"
 sllm_vr_meddle_3_desc:0 "종주국의 강압 통치에 백성들이 분노하고 있습니다."
 cb_sllm_vr_proxy:0 "대리전"
 cb_sllm_vr_proxy_desc:0 "종주국의 명으로 치르는 전쟁."
 casus_belli_cb_sllm_vr_proxy:0 "대리전"
 cb_sllm_vr_prize:0 "종속국 쟁탈"
 cb_sllm_vr_prize_desc:0 "우리와 국경이 닿은 남의 종속국을 그 종주국에게서 빼앗을 수 있습니다."
 casus_belli_cb_sllm_vr_prize:0 "종속국 쟁탈"
 wg_sllm_vr_proxy:0 "대리전"
 wg_sllm_vr_proxy_desc:0 "종주국을 대신해 싸운다. 이기면 상대는 굴욕을 당한다."
 wg_sllm_vr_prize:0 "종속국 빼앗기"
 wg_sllm_vr_prize_desc:0 "이기면 국경의 그 종속국이 우리 종속국이 되고, 새 통치자가 선다."
 wg_sllm_vr_prize_accept:0 "국경의 그 종속국이 우리 종속국이 되고, 우리가 고른 새 통치자가 선다."
 sllm_vr_tithe:0 "종주국에 바친 함대"
 sllm_vr_tithe_desc:0 "종주국에 우리 함대 하나를 아주 넘겨야 했습니다."
 sllm_vr_tithe_forced:0 "종주국에 빼앗긴 함대"
 sllm_vr_tithe_forced_desc:0 "종주국이 우리 뜻을 거슬러 함대 하나를 빼앗아 갔습니다."
 sllm_vo_defiance:0 "종주국 명령 거역"
 sllm_vo_defiance_desc:0 "종주국의 명령을 거절했고, 종주국은 이를 잊지 않았습니다."
 sllm_vo_minder:0 "궁정의 종주국 감시관"
 sllm_vo_minder_desc:0 "종주국의 관리가 우리 궁정에 앉아 통치자에게 「조언」합니다."
