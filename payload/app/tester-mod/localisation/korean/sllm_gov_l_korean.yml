l_korean:
 planet_automation_sllm_governor:0 "총독 방침"
 planet_automation_sllm_governor_desc:0 "SLLM에서 총독에게 맡긴 방침(집무실 → 행성 총독 → 행성 맡기기)대로 이 행성의 건물·지구·특화를 짓습니다.\n\n총독 기질에 따라 국고가 모자라면 공사를 쉽니다. 방침을 맡기지 않은 행성은 건드리지 않습니다."
 sllm_gov_mandate_research:0 "총독 관할: 연구"
 sllm_gov_mandate_research_desc:0 "SLLM에서 맡긴 연구 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_foundry:0 "총독 관할: 합금"
 sllm_gov_mandate_foundry_desc:0 "SLLM에서 맡긴 합금 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_factory:0 "총독 관할: 소비재"
 sllm_gov_mandate_factory_desc:0 "SLLM에서 맡긴 소비재 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_mining:0 "총독 관할: 광업"
 sllm_gov_mandate_mining_desc:0 "SLLM에서 맡긴 광업 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_generator:0 "총독 관할: 발전"
 sllm_gov_mandate_generator_desc:0 "SLLM에서 맡긴 발전 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_farming:0 "총독 관할: 농업"
 sllm_gov_mandate_farming_desc:0 "SLLM에서 맡긴 농업 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_urban:0 "총독 관할: 도시·교역"
 sllm_gov_mandate_urban_desc:0 "SLLM에서 맡긴 도시·교역 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_fortress:0 "총독 관할: 요새"
 sllm_gov_mandate_fortress_desc:0 "SLLM에서 맡긴 요새 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_temper_frugal:0 "꼼꼼한 총독"
 sllm_gov_temper_frugal_desc:0 "총독이 광물 한 덩이까지 셉니다. 건물 비용이 조금 줄어듭니다."
 sllm_gov_temper_bold:0 "대담한 총독"
 sllm_gov_temper_bold_desc:0 "총독이 공사판을 몰아붙입니다. 건물이 더 빨리 올라갑니다."
 sllm_gov_veteran:0 "숙련된 총독"
 sllm_gov_veteran_desc:0 "방침을 맡은 지 1년, 총독이 이 행성을 손바닥 보듯 압니다. 공사가 더 빨라지고 모든 직업의 생산이 조금 늘어납니다."
 sllm_gov.10.name:0 "[Root.GetName]의 총독 방침"
 sllm_gov.10.desc:0 "[Root.GetName]의 총독 §H[sllm_gov_face.GetName]§!이(가) 화면 너머로 고개를 숙입니다.\n\n「알겠습니다. [Root.GetName]은(는) 오늘부터 §Y[Root.sllm_gov_mandate_now]§! 행성입니다. 공사는 제가 하나씩 직접 챙기겠습니다.」\n\n[Root.sllm_gov_temper_say]"
 sllm_gov.10.a:0 "맡기겠소."
 sllm_gov.11.name:0 "[Root.GetName]의 손에 익은 총독"
 sllm_gov.11.desc:0 "§H[sllm_gov_face.GetName]§!이(가) [Root.GetName]에서 짧은 보고를 보내왔습니다.\n\n「이 행성을 맡은 지 1년이 지났습니다. 처음엔 헤맸지만, 이제 어디에 무엇을 지어야 할지 눈 감고도 압니다.」\n\n총독이 §Y숙련§!되었습니다. 공사가 더 빨라지고 모든 직업의 생산이 조금 늘어납니다."
 sllm_gov.11.a:0 "수고했소."
 sllm_gov_mname_research:0 "연구"
 sllm_gov_mname_foundry:0 "합금"
 sllm_gov_mname_factory:0 "소비재"
 sllm_gov_mname_mining:0 "광업"
 sllm_gov_mname_generator:0 "발전"
 sllm_gov_mname_farming:0 "농업"
 sllm_gov_mname_urban:0 "도시·교역"
 sllm_gov_mname_fortress:0 "요새"
 sllm_gov_mname_none:0 "직접 관리"
 sllm_gov_tsay_frugal:0 "「다만 국고 광물이 1,000 아래로 내려가면 공사를 멈추겠습니다. 빚지고 짓는 건 제 방식이 아닙니다.」"
 sllm_gov_tsay_normal:0 "「국고 광물이 300 아래로 내려가면 잠시 쉬어 가겠습니다.」"
 sllm_gov_tsay_bold:0 "「자원 사정은 신경 쓰지 않고 밀어붙이겠습니다. 멈추라 하실 때까지요.」"
 sllm_gov_mname_unity:0 "통합력"
 sllm_gov_mname_trade:0 "교역"
 sllm_gov_mandate_unity:0 "총독 관할: 통합력"
 sllm_gov_mandate_unity_desc:0 "SLLM에서 맡긴 통합력 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_gov_mandate_trade:0 "총독 관할: 교역"
 sllm_gov_mandate_trade_desc:0 "SLLM에서 맡긴 교역 방침대로 총독이 이 행성을 꾸립니다. 공사가 빨라지고 방침에 맞는 직업의 생산이 조금 늘어납니다."
 sllm_quota_p0:0 "행성 할당량: 준비"
 sllm_quota_p0_desc:0 "SLLM에서 이 행성에 할당량을 매겼습니다. 총독이 바탕을 깔고 있고, 주민들은 벌써 수군거립니다."
 sllm_quota_p1:0 "행성 할당량: 1단계"
 sllm_quota_p1_desc:0 "할당량 1단계가 진행 중입니다. 모든 일자리가 나라를 위해 더 일하고, 주민들은 그 무게를 느낍니다."
 sllm_quota_p2:0 "행성 할당량: 2단계"
 sllm_quota_p2_desc:0 "할당량 2단계입니다. 생산이 오르는 만큼 불만도 오릅니다."
 sllm_quota_p3:0 "행성 할당량: 3단계"
 sllm_quota_p3_desc:0 "할당량 마지막 단계입니다. 행성이 한계까지 버티고 있지만 끝이 보입니다."
 sllm_quota_done:0 "할당량 완수"
 sllm_quota_done_desc:0 "할당량을 다 채웠고 마지막 물자가 떠났습니다. 행성 전체에 안도감이 퍼집니다."
 sllm_quota_fail:0 "무너진 할당량"
 sllm_quota_fail_desc:0 "할당량이 불안 속에 무너졌습니다. 주민들은 헛되이 몰아붙여졌던 일을 기억합니다."
