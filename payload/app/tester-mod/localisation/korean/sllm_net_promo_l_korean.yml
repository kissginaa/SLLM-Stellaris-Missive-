l_korean:
 sllm_net_promo_1:0 "인플루언서 홍보"
 sllm_net_promo_1_desc:0 "트윙클 인플루언서가 이 행성을 소개했습니다. 이곳에서 살아 보고 싶다는 사람이 조금 늘었습니다."
 sllm_net_promo_2:0 "인기 인플루언서 홍보"
 sllm_net_promo_2_desc:0 "이름난 트윙클 인플루언서의 홍보 글이 퍼지면서 이 행성으로 이주하려는 사람이 늘었습니다."
 sllm_net_promo_3:0 "대세 인플루언서 홍보"
 sllm_net_promo_3_desc:0 "은하 최고 인플루언서의 홍보 덕분에 이 행성이 요즘 가장 살고 싶은 곳으로 꼽힙니다."
