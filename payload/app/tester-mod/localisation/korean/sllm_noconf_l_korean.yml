l_korean:
 sllm_noconf_survived:0 "불신임 극복"
 sllm_noconf_survived_desc:0 "정부가 의회의 불신임안을 이겨 냈다. 반대파의 기세가 한풀 꺾였다."
 sllm_noconf_lameduck:0 "레임덕"
 sllm_noconf_lameduck_desc:0 "의회가 정부 불신임안을 가결했다. 정부는 자리를 지켰지만 아무도 그 말을 따르려 하지 않는다."
 sllm_noconf_dissolved:0 "의회 해산"
 sllm_noconf_dissolved_desc:0 "정부가 불신임 표결을 피하려고 의회를 해산했다. 거리마다 항의가 끊이지 않는다."
