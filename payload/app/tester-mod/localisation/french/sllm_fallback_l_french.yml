# sllm_iscq_l_english.yml
 sllm_iscq_peace_1_title:0 "Summit Task: Peace with [sllm_iscq1_target.GetName]"
 sllm_iscq_peace_1_desc:0 "A task set by [sllm_iscq1_giver.GetName] at the interstellar summit. Stay at peace with [sllm_iscq1_target.GetName] until the deadline.\n\nMonths left: [Root.sllm_iscq1_left]\n\nOn success: the promised reward and +15 opinion from that empire. On failure: the penalty and -15 opinion. The full task and rewards are in the SLLM app's summit window."
 sllm_iscq_war_1_title:0 "Summit Task: Common Enemy [sllm_iscq1_target.GetName]"
 sllm_iscq_war_1_desc:0 "A task set by [sllm_iscq1_giver.GetName] at the interstellar summit. Be at war with [sllm_iscq1_target.GetName] before the deadline.\n\nMonths left: [Root.sllm_iscq1_left]\n\nOn success: the promised reward and +15 opinion from that empire. On failure: the penalty and -15 opinion. The full task and rewards are in the SLLM app's summit window."
 sllm_iscq_relation_1_title:0 "Summit Task: Relations with [sllm_iscq1_target.GetName]"
 sllm_iscq_relation_1_desc:0 "A task set by [sllm_iscq1_giver.GetName] at the interstellar summit. Raise [sllm_iscq1_target.GetName]'s opinion of us to [Root.sllm_iscq1_goal].\nNow: [Root.sllm_iscq1_now]\n\nMonths left: [Root.sllm_iscq1_left]\n\nOn success: the promised reward and +15 opinion from that empire. On failure: the penalty and -15 opinion. The full task and rewards are in the SLLM app's summit window."
 sllm_iscq_naval_1_title:0 "Summit Task: Build Up the Fleet"
 sllm_iscq_naval_1_desc:0 "A task set by [sllm_iscq1_giver.GetName] at the interstellar summit. Fill [Root.sllm_iscq1_goal]% of our naval capacity.\nNow: [Root.sllm_iscq1_now]%\n\nMonths left: [Root.sllm_iscq1_left]\n\nOn success: the promised reward and +15 opinion from that empire. On failure: the penalty and -15 opinion. The full task and rewards are in the SLLM app's summit window."
