# sllm_vassal_court_l_english.yml
 sllm_vc_overseer:0 "Overlord's Overseer"
 sllm_vc_overseer_desc:0 "An overseer sent by our overlord resides in our capital, keeping a close eye on us."
# sllm_vassal_l_english.yml
 sllm_vassal_grateful:0 "Grateful to the Overlord"
 sllm_vassal_grateful_desc:0 "Our overlord granted our petition. Loyalty rises every month."
 sllm_vassal_resentful:0 "Resentful of the Overlord"
 sllm_vassal_resentful_desc:0 "Our overlord refused our petition. Loyalty falls every month."
 sllm_research_aid_given:0 "Research Aid Given"
 sllm_research_aid_given_desc:0 "We are sharing our scientists with another empire. Research speed is reduced for a year."
 sllm_research_aid_received:0 "Research Aid Received"
 sllm_research_aid_received_desc:0 "Another empire is sharing its scientists with us. Research speed is increased for a year."
 sllm_overlord_defied:0 "Defied Our Demand"
# sllm_vassal_reign_l_english.yml
 sllm_vr_puppet:0 "Overlord-Installed Ruler"
 sllm_vr_puppet_desc:0 "Our ruler owes the throne to our overlord and keeps the court in line."
 sllm_vr_puppet_ours:0 "Overlord's Governor"
 sllm_vr_puppet_ours_desc:0 "Our ruler is one of the overlord's own officials, sent to govern us."
 sllm_vr_grudge:0 "Deposed Ruler at Court"
 sllm_vr_grudge_desc:0 "The ruler our overlord pushed aside still lingers at court, and so does the resentment."
 sllm_vr_meddle_1:0 "Resentment of Meddling"
 sllm_vr_meddle_1_desc:0 "Our people resent the overlord meddling in our affairs."
 sllm_vr_meddle_2:0 "Deep Resentment of Meddling"
 sllm_vr_meddle_2_desc:0 "The overlord's constant interference is stirring anger across our worlds."
 sllm_vr_meddle_3:0 "Fury at Meddling"
 sllm_vr_meddle_3_desc:0 "Our people are furious at the overlord's heavy-handed rule."
 cb_sllm_vr_proxy:0 "Proxy War"
 cb_sllm_vr_proxy_desc:0 "Ordered to war by our overlord."
 casus_belli_cb_sllm_vr_proxy:0 "Proxy War"
 cb_sllm_vr_prize:0 "Contested Subject"
 cb_sllm_vr_prize_desc:0 "A subject on our border can be taken from its overlord."
 casus_belli_cb_sllm_vr_prize:0 "Contested Subject"
 wg_sllm_vr_proxy:0 "Proxy War"
 wg_sllm_vr_proxy_desc:0 "Fight a war on our overlord's behalf. If we win, the enemy is humiliated."
 wg_sllm_vr_prize:0 "Take Their Subject"
 wg_sllm_vr_prize_desc:0 "If we win, their subject on our border becomes our subject and a new ruler takes its throne."
 wg_sllm_vr_prize_accept:0 "Their subject on our border becomes our subject, with a new ruler of our choosing."
 sllm_vr_tithe:0 "Navy Handed to the Overlord"
 sllm_vr_tithe_desc:0 "We were made to hand one of our fleets to our overlord for good."
 sllm_vr_tithe_forced:0 "Navy Seized by the Overlord"
 sllm_vr_tithe_forced_desc:0 "Our overlord seized one of our fleets against our will."
 sllm_vo_defiance:0 "Defied Our Overlord"
 sllm_vo_defiance_desc:0 "We refused an order from our overlord, and it has not forgotten."
 sllm_vo_minder:0 "Overlord's Minder at Court"
 sllm_vo_minder_desc:0 "An official of our overlord sits at our court and \"advises\" our ruler."
