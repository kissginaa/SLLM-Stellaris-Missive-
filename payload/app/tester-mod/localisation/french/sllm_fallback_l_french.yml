# sllm_letters_l_english.yml
 sllm_trait_letter_trusted:0 "Leader's Confidence"
 sllm_trait_letter_trusted_desc:0 "The ruler granted a request made in a personal letter. This leader means to repay that trust."
# sllm_lobby_l_english.yml
 sllm_lobby_favor:0 "Interest Group Backing"
 sllm_lobby_favor_desc:0 "An interest group close to us has joined hands with the government. The faction backs the government more."
 sllm_lobby_spurned:0 "Resentment of Lobbying"
 sllm_lobby_spurned_desc:0 "The government sided with the opposing interest group. The faction's discontent grows."
 sllm_lobby_scandal:0 "Bribery Scandal"
 sllm_lobby_scandal_desc:0 "It has come out that the ruler secretly took money from an interest group. Public anger boils over."
# sllm_log_l_english.yml
 sllm_log_home_pride:0 "Legend of Galaxy Hometown Pride"
 sllm_log_home_pride_desc:0 "This world's club finished near the top of the Legend of Galaxy league. Locals are proud, and more people want to move here."
 sllm_log_home_gloom:0 "Legend of Galaxy Hometown Gloom"
 sllm_log_home_gloom_desc:0 "This world's club has finished last season after season. The mood here has soured."
 sllm_log_festival:0 "Worlds Victory Festival"
 sllm_log_festival_desc:0 "Our club won the Galactic Legend of Galaxy World Championship. The whole empire is celebrating."
