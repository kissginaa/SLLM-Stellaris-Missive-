# sllm_tension_l_english.yml
 sllm_tension:0 "Rivalry Tension"
 sllm_tension_type:0 "Rivalry Tension"
 sllm_tension_desc:0 "The galaxy watches [sllm_tn_a.GetName] and [sllm_tn_b.GetName]. Fleets gathering on the border, incidents and harsh words all raise the tension between them; quiet months let it cool.\n\nAt 100, both sides gain a casus belli against each other."
 sllm_tension_monthly_change_tooltip:0 "Cools by itself each month. Warships massing on the other side's border, border incidents and diplomatic crises raise it."
 sllm_tn_stage_0:0 "Calm"
 sllm_tn_stage_0_desc:0 "Relations are strained, but nobody expects war."
 sllm_tn_stage_1:0 "Cold"
 sllm_tn_stage_1_desc:0 "Ambassadors exchange cold words. Merchants grow nervous."
 sllm_tn_stage_2:0 "Crisis"
 sllm_tn_stage_2_desc:0 "From 50: the two powers think much worse of each other. From 75: both mobilise (naval capacity +20, ship upkeep +10%)."
 sllm_tn_stage_3:0 "On the Brink"
 sllm_tn_stage_3_desc:0 "From 90: stability falls and opinion worsens further. At 100: both gain a casus belli against each other."
 sllm_tn_watch:0 "Watch Closely"
 sllm_tn_watch_desc:0 "This bar only reports the tension between the two powers. What we do with our own diplomacy moves it."
 sllm_tn_watch_tt:0 "Nothing to choose here — the bar is kept by the scenario."
 sllm_tn_mobilized:0 "Rival Mobilisation"
 sllm_tn_mobilized_desc:0 "Tension with our great rival has put the nation on a war footing."
 sllm_tn_brink:0 "On the Brink of War"
 sllm_tn_brink_desc:0 "War with our great rival seems only days away. The people rally, and fear."
 sllm_tn_humbled:0 "Defeated in the Showdown"
 sllm_tn_humbled_desc:0 "We lost the war against our great rival. Our word carries less weight and our people are disheartened."
 sllm_tn_crisis:0 "Rivalry Crisis"
 sllm_tn_brink_op:0 "On the Brink of War"
 cb_sllm_tn_showdown:0 "Showdown"
 cb_sllm_tn_showdown_desc:0 "Tension with our great rival has reached its peak."
 casus_belli_cb_sllm_tn_showdown:0 "Showdown"
 wg_sllm_tn_showdown:0 "Showdown"
 wg_sllm_tn_showdown_desc:0 "Settle the rivalry by force. The loser is humbled for ten years."
 wg_sllm_tn_showdown_accept:0 "The loser is humbled for ten years (influence −20%, unity −10%)."
 sllm_tn.ok:0 "We will watch closely."
 sllm_tn.12.name:0 "Crisis Between the Great Powers"
 sllm_tn.12.desc:0 "Tension between [sllm_tn_a.GetName] and [sllm_tn_b.GetName] has passed 50. Their ambassadors trade accusations and both governments speak of the other as an enemy."
 sllm_tn.13.name:0 "Mobilisation"
 sllm_tn.13.desc:0 "Tension between [sllm_tn_a.GetName] and [sllm_tn_b.GetName] has passed 75. Both have called up their reserves and their shipyards work day and night."
 sllm_tn.14.name:0 "On the Brink of War"
 sllm_tn.14.desc:0 "Tension between [sllm_tn_a.GetName] and [sllm_tn_b.GetName] has passed 90. Ultimatums are being drafted. One spark could start a war."
 sllm_tn.15.name:0 "The Last Restraint Breaks"
 sllm_tn.15.desc:0 "Tension between [sllm_tn_a.GetName] and [sllm_tn_b.GetName] has reached its peak. Each now holds a casus belli against the other. Whether war comes is up to them."
 sllm_tn.20.name:0 "Tension Eases"
 sllm_tn.20.desc:0 "Tension between [sllm_tn_a.GetName] and [sllm_tn_b.GetName] has eased somewhat. The galaxy breathes a little easier."
# sllm_vassal_admin_l_english.yml
