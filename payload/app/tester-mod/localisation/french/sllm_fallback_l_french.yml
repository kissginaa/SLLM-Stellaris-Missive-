 sllm_iscq_income_energy_1_desc:0 "A task set by [sllm_iscq1_giver.GetName] at the interstellar summit. Raise monthly Energy income to [Root.sllm_iscq1_goal].\nNow: [Root.sllm_iscq1_now]\n\nMonths left: [Root.sllm_iscq1_left]\n\nOn success: the promised reward and +15 opinion from that empire. On failure: the penalty and -15 opinion. The full task and rewards are in the SLLM app's summit window."
