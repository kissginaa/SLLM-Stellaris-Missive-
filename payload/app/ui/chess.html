<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Chess</title>
<!-- 지도자와 체스(2026-10-30). 앱: src/features/chess-app.ts · 규칙·AI: src/chess.ts. 직접 만나는 자리(사교회·만찬)에서만 연다.
     문구는 L(한, 영)만(언어 팩 호환). 인물 이름·대화는 data-i18n-skip. 말은 플레이어가 물을 때만(AI 한 번). -->
<style>
 :root{--bg:#0b1014;--panel:#121a20;--text:#e3e8ea;--dim:#8a9aa2;--hi:#d9b77a;--line:#2a3640;--light:#d8c7a4;--dark:#8a6b4a;--sel:#e6d36a;--mv:#6fbf8a;--chk:#d65a4a}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Malgun Gothic","Segoe UI",sans-serif;overflow:hidden}
 button,input{font:inherit;color:var(--text);border:1px solid var(--line);background:#18232b;outline:none}
 button{cursor:pointer;padding:5px 12px} button:hover:not(:disabled){border-color:var(--hi);color:var(--hi)} button:disabled{opacity:.45;cursor:default}
 #top{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;-webkit-app-region:drag;border-bottom:1px solid var(--line)}
 #top .t{font-weight:700;color:var(--hi);letter-spacing:.08em} #top .sp{flex:1} #top button{-webkit-app-region:no-drag}
 #x{background:none;border-color:transparent;color:var(--dim)}
 #main{position:absolute;top:40px;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(420px,1fr) 360px;gap:14px;padding:14px}
 #left{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
 .who{width:min(100%,calc(100vh - 150px));display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
 .who b{color:var(--text)}
 #board{width:min(100%,calc(100vh - 150px));aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #3b2c1e;user-select:none}
 .sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:min(5.2vw,6.2vh);line-height:1;cursor:pointer}
 .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
 .sq.sel{box-shadow:inset 0 0 0 4px var(--sel)} .sq.last{background-image:linear-gradient(#e6d36a44,#e6d36a44)}
 .sq.can::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:#2f6b45aa}
 .sq.can.cap::after{width:86%;height:86%;background:none;border:4px solid #2f6b45aa}
 .sq.chk{box-shadow:inset 0 0 0 4px var(--chk)}
 .pc.w{color:#fbf7ee;text-shadow:0 0 2px #000,0 1px 2px #000} .pc.b{color:#1b1410;text-shadow:0 0 1px #fff8}
 .co{position:absolute;font-size:10px;color:#0007;font-weight:700} .co.f{right:3px;bottom:1px} .co.r{left:3px;top:1px}
 #status{min-height:20px;color:var(--hi)}
 #promo{display:none;gap:6px} #promo.on{display:flex}
 #right{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);background:var(--panel)}
 #right h4{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);font-weight:600}
 #chat{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
 .ln{padding:5px 8px;border:1px solid var(--line);max-width:92%} .ln.me{align-self:flex-end;border-color:#3d5566} .ln.them{align-self:flex-start;border-color:#5a4a33}
 .ln.sys{align-self:center;border:none;color:var(--dim);font-size:11.5px;padding:0}
 .ln .n{display:block;font-size:11px;color:var(--dim)}
 #ask{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)} #ask input{flex:1;padding:6px 8px}
 #moves{max-height:90px;overflow-y:auto;padding:6px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
 #foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)} #foot .sp{flex:1}
</style></head>
<body>
<div id="top"><span class="t" id="ttl"></span><span id="where" data-i18n-skip></span><span class="sp"></span><button id="x" type="button">✕</button></div>
<div id="main">
 <div id="left">
  <div class="who"><span id="oppLine" data-i18n-skip></span><span id="rec"></span></div>
  <div id="board"></div>
  <div class="who"><span id="meLine"></span><span id="status"></span></div>
  <div id="promo"></div>
 </div>
 <div id="right">
  <h4 id="chatH"></h4>
  <div id="chat" data-i18n-skip></div>
  <div id="ask"><input id="q" maxlength="500" data-i18n-skip><button id="send" type="button"></button></div>
  <div id="moves" data-i18n-skip></div>
  <div id="foot"><button id="resign" type="button"></button><span class="sp"></span><button id="close" type="button"></button></div>
 </div>
</div>
<script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script>
<script>
(() => {
 const L = (ko, en) => (window.SLLMI18n && window.SLLMI18n.pick ? window.SLLMI18n.pick(ko, en) : ko);
 const $ = (id) => document.getElementById(id);
 const GLYPH = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
 let S = null, sel = -1, armed = false, pendingPromo = null, busyAsk = false;

 function texts() {
  document.title = L('체스', 'Chess'); $('ttl').textContent = L('체스', 'CHESS');
  $('chatH').textContent = L('대화 — 궁금한 걸 물어보세요(판 이야기도 됩니다)', 'Talk — ask anything (including about the board)');
  $('q').placeholder = L('예: 퀸을 잃었네… / 지금 누가 유리한가?', 'e.g. "I lost my queen…" / "Who is ahead?"');
  $('send').textContent = L('말하기', 'Say'); $('close').textContent = L('닫기', 'Close');
  draw();
 }
 const flip = () => S && S.player === 'b';
 function sqIndex(row, col) { return flip() ? row * 8 + (7 - col) : (7 - row) * 8 + col; }
 function draw() {
  if (!S) return;
  if (!S.active) { $('status').textContent = L('두고 있는 판이 없습니다.', 'No game in progress.'); $('board').textContent = ''; return; }
  $('where').textContent = '· ' + S.sceneName;
  $('oppLine').innerHTML = ''; const b = document.createElement('b'); b.textContent = S.oppName; $('oppLine').append(b, document.createTextNode(' · ' + (S.player === 'w' ? L('흑', 'Black') : L('백', 'White'))));
  $('rec').textContent = L(`전적 ${S.record.win}승 ${S.record.loss}패 ${S.record.draw}무`, `Record ${S.record.win}W ${S.record.loss}L ${S.record.draw}D`);
  $('meLine').textContent = L('지도자', 'You') + ' · ' + (S.player === 'w' ? L('백', 'White') : L('흑', 'Black'));
  $('status').textContent = S.over ? S.over.text : S.thinking ? L(`${S.oppName}이(가) 생각 중…`, `${S.oppName} is thinking…`) : S.turn === S.player ? (S.check ? L('체크! 지도자 차례입니다.', 'Check! Your move.') : L('지도자 차례입니다.', 'Your move.')) : '';
  const bd = $('board'); bd.textContent = '';
  const targets = sel >= 0 ? S.legal.filter((m) => m.from === sel) : [];
  const kingSq = S.check ? S.board.indexOf(S.turn === 'w' ? 'K' : 'k') : -1;
  for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
   const i = sqIndex(row, col), f = i % 8, r = i >> 3, x = S.board[i] || '';
   const d = document.createElement('div'); d.className = 'sq ' + ((f + r) % 2 ? 'l' : 'd');
   if (i === sel) d.classList.add('sel'); if (S.last && (S.last.from === i || S.last.to === i)) d.classList.add('last');
   if (targets.some((m) => m.to === i)) { d.classList.add('can'); if (x) d.classList.add('cap'); }
   if (i === kingSq) d.classList.add('chk');
   if (x) { const p = document.createElement('span'); p.className = 'pc ' + (x === x.toUpperCase() ? 'w' : 'b'); p.textContent = GLYPH[x.toUpperCase()]; d.append(p); }
   if (col === 7) { const c = document.createElement('span'); c.className = 'co r'; c.textContent = String(r + 1); d.append(c); }
   if (row === 7) { const c = document.createElement('span'); c.className = 'co f'; c.textContent = 'abcdefgh'[f]; d.append(c); }
   d.onclick = () => click(i); bd.append(d);
  }
  const ch = $('chat'), atBottom = ch.scrollTop + ch.clientHeight >= ch.scrollHeight - 30; ch.textContent = '';
  for (const l of S.chat) { const e = document.createElement('div'); e.className = 'ln ' + l.who; if (l.who !== 'sys') { const n = document.createElement('span'); n.className = 'n'; n.textContent = l.who === 'me' ? L('지도자', 'You') : S.oppName; e.append(n); } e.append(document.createTextNode(l.text)); ch.append(e); }
  if (S.asking) { const e = document.createElement('div'); e.className = 'ln sys'; e.textContent = L('…', '…'); ch.append(e); }
  if (atBottom) ch.scrollTop = ch.scrollHeight;
  $('moves').textContent = S.moves.length ? S.moves.map((m, k) => (k % 2 === 0 ? `${k / 2 + 1}. ` : '') + m).join(' ') : '';
  $('send').disabled = $('q').disabled = !S.talkable || S.asking || busyAsk;
  if (!S.talkable) $('q').placeholder = L('이 상대와의 대화는 아직 연결되지 않았습니다.', 'Talking with this opponent is not connected yet.');
  $('resign').textContent = armed ? L('정말 기권할까요? 한 번 더', 'Resign? Press again') : L('기권', 'Resign');
  $('resign').disabled = !!S.over;
 }
 async function click(i) {
  if (!S || !S.active || S.over || S.thinking || S.turn !== S.player) return;
  const x = S.board[i];
  if (sel >= 0) {
   const ms = S.legal.filter((m) => m.from === sel && m.to === i);
   if (ms.length) {
    if (ms.length > 1) { pendingPromo = { from: sel, to: i }; showPromo(); return; }
    const from = sel; sel = -1; await move(from, i, ms[0].promo || ''); return;
   }
  }
  sel = x && S.legal.some((m) => m.from === i) ? i : -1; draw();
 }
 function showPromo() {
  const p = $('promo'); p.textContent = ''; p.classList.add('on');
  for (const [k, ko, en] of [['Q', '퀸', 'Queen'], ['R', '룩', 'Rook'], ['B', '비숍', 'Bishop'], ['N', '나이트', 'Knight']]) {
   const b = document.createElement('button'); b.type = 'button'; b.textContent = GLYPH[k] + ' ' + L(ko, en);
   b.onclick = async () => { const pp = pendingPromo; pendingPromo = null; p.classList.remove('on'); sel = -1; if (pp) await move(pp.from, pp.to, k); };
   p.append(b);
  }
 }
 async function move(from, to, promo) { const r = await window.sllm.chessMove({ from, to, promo }); if (r && !r.ok && r.error) note(r.error); }
 function note(t) { $('status').textContent = t; }
 async function say() {
  const t = $('q').value.trim(); if (!t || busyAsk) return; busyAsk = true; $('q').value = ''; draw();
  try { const r = await window.sllm.chessAsk(t); if (r && !r.ok && r.error) { note(r.error); $('q').value = t; } }
  finally { busyAsk = false; draw(); }
 }
 $('send').onclick = say; $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) say(); });
 $('resign').onclick = async () => { if (!armed) { armed = true; draw(); setTimeout(() => { armed = false; draw(); }, 4000); return; } armed = false; await window.sllm.chessResign(); };
 $('x').onclick = $('close').onclick = () => window.sllm.chessClose();
 window.sllm.onChessState((s) => { S = s; if (sel >= 0 && !(S.legal || []).some((m) => m.from === sel)) sel = -1; draw(); });
 document.addEventListener('sllm-language', texts);
 window.sllm.chessState().then((s) => { S = s; texts(); });
})();
</script></body></html>
