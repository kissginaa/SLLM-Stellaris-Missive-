<style>

<script>

 }

 addEventListener('resize', () => drawDealer());

   const inp = h('input'); inp.type = 'number'; inp.min = String(S.limits.minBuyIn); inp.value = String(Math.max(S.limits.minBuyIn, 1000)); const r1 = h('div', 'bar'); r1.append(h('span', '', L('바이인', 'Buy-in')), inp); p.append(r1);
   if (S.leaders.length) { p.append(h('div', 'note', L(`함께 앉을 우리 지도자(최대 ${S.limits.maxCompanions}명, 칩은 그 사람 몫)`, `Leaders to bring (up to ${S.limits.maxCompanions}; their chips are their own)`))); const box = h('div', 'bar'); for (const l of S.leaders.slice(0, 16)) { const lb = h('label', ''); const cb = h('input'); cb.type = 'checkbox'; cb.style.width = 'auto'; cb.checked = pkComp.includes(l.key); cb.onchange = () => { pkComp = cb.checked ? [...pkComp, l.key].slice(0, S.limits.maxCompanions) : pkComp.filter((x) => x !== l.key); draw(); }; lb.append(cb, document.createTextNode(' ' + l.name)); box.append(lb); } p.append(box); }
   p.append(btn(L('앉기', 'Sit down'), async () => { await call(window.sllm.casinoPokerSit({ buyIn: Number(inp.value), companions: pkComp })); draw(); }, 'main')); m.append(p); return;
  }
  const b = h('div', 'board'), tb = h('div', 'ptable'), ov = h('div', 'oval'), bd = h('div', 'cards'); for (const c of P.board) bd.append(cardEl(c, true)); ov.append(bd, h('div', '', L(`판돈 ${fmt(P.pot)}`, `Pot ${fmt(P.pot)}`))); if (P.youHand) ov.append(h('div', 'note', L(`내 패: ${P.youHand}`, `Your hand: ${P.youHand}`))); tb.append(ov);
  P.seats.forEach((s, i) => { const [x, y] = SEATPOS[i] || [50, 50], e = h('div', 'seat' + (s.you ? ' you' : '') + (s.folded ? ' fold' : '') + (P.toAct === s.id ? ' turn' : '') + (P.done && P.winners.includes(s.id) ? ' won' : '')); e.style.left = x + '%'; e.style.top = y + '%';
   const ga = !s.you && !s.companion ? guestArt(s.id + s.name) : null; if (ga) { const im = h('img', 'pf'); im.src = ga; im.alt = ''; e.append(im); }
   e.append(h('div', 'nm', s.name + (s.companion ? ' ★' : ''))); e.append(h('div', 'bt', L(`칩 ${fmt(s.chips)}${s.bet ? ' · 베팅 ' + fmt(s.bet) : ''}${s.allIn ? ' · 올인' : ''}${s.folded ? ' · 폴드' : ''}`, `Chips ${fmt(s.chips)}${s.bet ? ' · bet ' + fmt(s.bet) : ''}${s.allIn ? ' · all-in' : ''}${s.folded ? ' · folded' : ''}`)));
   const r = h('div', 'row'); for (const c of s.hole) r.append(cardEl(c, true)); e.append(r); tb.append(e); });
  b.append(tb);
  const bar = h('div', 'bar'); bar.style.justifyContent = 'center'; const NAMES = { fold: ['폴드', 'Fold'], check: ['체크', 'Check'], call: ['콜', 'Call'], raise: ['레이즈', 'Raise'] };
  for (const a of P.legal) bar.append(btn(L(...NAMES[a]), () => call(window.sllm.casinoPokerAct(a)).then(draw), a === 'raise' || a === 'call' ? 'main' : ''));
  if (P.done) bar.append(btn(L('다음 판', 'Next hand'), () => call(window.sllm.casinoPokerNext()).then(draw), 'main'));
  bar.append(btn(L('일어나기(칩을 금고로)', 'Leave (chips to vault)'), async () => { await call(window.sllm.casinoPokerLeave()); pkComp = null; draw(); }));
  b.append(bar);
  const chat = h('div', 'panel'), log = h('div', 'chat'); for (const c of P.chat) log.append(h('div', c.who, c.who === 'sys' ? c.text : `${c.who === 'me' ? L('나', 'Me') + (c.name ? ' → ' + c.name : '') : c.name}: ${c.text}`)); chat.append(log);
  if (P.talkable) { const row = h('div', 'bar'); if (P.companions.length > 1) { const sel = h('select'); for (const c of P.companions) { const o = h('option', '', c.name); o.value = c.key; if (askTo === c.key) o.selected = true; sel.append(o); } sel.onchange = () => (askTo = sel.value); if (!askTo) askTo = P.companions[0].key; row.append(sel); } const inp = h('input'); inp.style.flex = '1'; inp.placeholder = L('함께 앉은 지도자에게 말 걸기', 'Say something to your leader'); const send = async () => { const t = inp.value.trim(); if (!t || P.asking) return; inp.value = ''; await call(window.sllm.casinoPokerAsk(t, askTo || undefined)); draw(); }; inp.onkeydown = (e) => { if (e.key === 'Enter') send(); }; const sb = btn(P.asking ? L('대답 기다리는 중…', 'Waiting…') : L('말하기', 'Say'), send); sb.disabled = P.asking; row.append(inp, sb); chat.append(row); }
  b.append(chat); m.append(b); log.scrollTop = log.scrollHeight;
 }

 $('lobbyBtn').onclick = () => { view = 'lobby'; draw(); };
 $('x').onclick = async () => { const r = await window.sllm.casinoClose(); if (r && !r.ok) say(r.error); };
 document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !busy && !(window.SLLMStellaChess && window.SLLMStellaChess.busy())) { if (view !== 'lobby') { view = 'lobby'; draw(); } else window.sllm.casinoClose().then((r) => r && !r.ok && say(r.error)); } });
 document.addEventListener('sllm-language', draw);
 if (window.sllm.onCasinoUpdate) window.sllm.onCasinoUpdate((s) => { S = s; if (!busy) draw(); });
 window.sllm.casinoState().then((s) => { S = s; if (S.poker) view = 'poker'; draw(); });
</script>
