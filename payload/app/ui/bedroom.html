<!-- 통치자 침실(2026-10-30, 계획서 8번). 앱: src/features/bedroom-app.ts · 자료: src/bedroom.ts. 입구: 개인실 책상 위 열쇠(private-rooms.js).
     몰입형 1600×900 무대(선술집·암시장과 같은 방식). 그림: assets/private-rooms/private/<성향>-bedroom.webp(02_침실_그림_의뢰서.md 의 고정 배치), 없으면 앱이 그린 밤 침실.
     자리(SPOT, 무대 좌표)는 의뢰서 2번 표의 % 를 그대로 옮김 — 그림이 오면 재서 맞춤.
     꾸미기: 자리 누르기 → 그 자리에 맞는 가진 물건 고르기. 어항 = 펫샵 물고기, 양탄자 = 애완동물. 배우자·연인 부르기 → 침대 곁에서 대화(물을 때만 AI).
     문구는 L(한, 영)만(언어 팩 호환). -->
<style>
 :root{--gold:#ffcf7a;--rose:#ff9ab8;--cyan:#7fe6ff;--text:#f2ece4;--dim:#a99f94;--hi:#ffcf7a}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;color:var(--text);font:15px/1.5 "Malgun Gothic","Segoe UI",sans-serif;overflow:hidden;user-select:none}
 button,input{font:inherit;color:var(--text)}
 #drag{position:absolute;z-index:30;left:0;right:0;top:0;height:30px;-webkit-app-region:drag}
 #x{position:absolute;z-index:31;right:12px;top:6px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;-webkit-app-region:no-drag} #x:hover{color:#fff}
 #stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#07060a}
 #scene,#artbg{position:absolute;inset:0;width:100%;height:100%} #artbg{background-size:100% 100%;display:none}
 #glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,transparent 50%,#000a 100%)}
 /* 자리 */
 .slot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;transition:box-shadow .25s,background .25s}
 .slot:hover{box-shadow:0 0 0 2px #ffcf7a66,0 0 26px #ffcf7a33;background:#ffcf7a0d}
 .slot.empty{visibility:hidden} body.deco .slot.empty{visibility:visible;border:2px dashed #ffcf7a77;background:#ffcf7a0a}
 body.deco .slot.empty::after{content:'+';font-size:30px;color:#ffcf7aaa}
 .slot img.it{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 14px #000c);pointer-events:none}
 .slot.room{transform:translateX(-50%);border-radius:0} .slot.room img.rm{display:block;width:100%;height:auto;pointer-events:none} .slot.room:hover{background:none;box-shadow:none} .slot.room:hover img.rm{filter:brightness(1.12) drop-shadow(0 0 14px #ffcf7a66)} /* 방에 세우는 가구(2026-10-31) */
 .slot .gl{width:76%;height:76%;max-width:120px;max-height:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#20160a;background:linear-gradient(135deg,#ffe2a8,#b07a2e);box-shadow:0 0 16px #ffcf7a55;pointer-events:none}
 .slot.wall .pic{width:100%;height:100%;object-fit:cover;border:7px solid #b8893a;border-radius:3px;box-shadow:inset 0 0 0 2px #5a3a10,0 10px 22px #000c;background:#1a140c}
 .slot .tag{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:1px 9px;border-radius:9px;background:#000c;border:1px solid #ffcf7a55;opacity:0;transition:opacity .2s;pointer-events:none}
 .slot:hover .tag,body.deco .slot .tag{opacity:1}
 /* 어항 */
 #tank{position:absolute;left:96px;top:250px;width:368px;height:270px;overflow:hidden;cursor:pointer;border-radius:6px}
 .fish{position:absolute;width:64px;height:40px;animation:swim linear infinite} .fish .b{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite alternate}
 .fish img{width:100%;height:100%;object-fit:contain} .fish.flip .b{transform:scaleX(-1)}
 @keyframes swim{0%{left:-70px}100%{left:380px}} @keyframes swimR{0%{left:380px}100%{left:-70px}} @keyframes bob{to{translate:0 10px}}
 .bubl{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;border:1px solid #bff4ff99;animation:rise linear infinite} @keyframes rise{to{bottom:290px;opacity:0}}
 /* 애완동물 */
 /* 개인 금고(2026-10-31): 어항 받침장에 박힌 작은 금고 — 누르면 금고 창(vault-ui.js) */
 #safe{position:absolute;z-index:4;left:208px;top:520px;width:64px;height:56px;padding:0;border-radius:6px;border:2px solid #6a5a44;background:linear-gradient(145deg,#8a8478,#4a463e 55%,#2e2b26);box-shadow:inset 0 0 0 3px #00000055,inset 0 2px 0 #ffffff33,0 4px 10px #000a;cursor:pointer}
 #safe .dial{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(#d8cfb8,#8a7a58 60%,#3a3220);box-shadow:0 0 0 2px #2a2418} #safe .hd{position:absolute;right:6px;top:50%;width:5px;height:18px;margin-top:-9px;border-radius:2px;background:#c8b888}
 #safe:hover{box-shadow:inset 0 0 0 3px #00000055,0 0 0 2px #ffcf7a99,0 0 22px #ffcf7a66} #safe::after{content:attr(data-tag);position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:1px 9px;border-radius:9px;background:#000c;border:1px solid #ffcf7a55;opacity:0;transition:opacity .2s;pointer-events:none;color:#f0e6d6} #safe:hover::after{opacity:1}
 body.noart #safe{left:410px;top:560px}
 /* 완성 침실(2026-10-31): 금고는 그림 속에 있다 — 그 자리를 누르는 투명 단추로, 올리면 금빛으로 빛난다 */
 body.fullart #safe{left:4px;top:578px;width:248px;height:214px;border:0;border-radius:14px;background:transparent;box-shadow:none} body.fullart #safe .dial,body.fullart #safe .hd{display:none}
 body.fullart #safe:hover{background:radial-gradient(closest-side,#ffcf7a2a,#ffcf7a00);box-shadow:0 0 0 2px #ffcf7a66,0 0 30px #ffcf7a55} body.fullart #safe::after{bottom:auto;top:-26px}
 body.fullart #guest{left:780px}
 #pets{position:absolute;inset:0;z-index:5;pointer-events:none} #pets .pet{pointer-events:auto} #guest{z-index:3} /* 가구(z 1~4) 위에 애완동물(2026-10-31) */
 .pet{position:absolute;width:118px;height:118px;transform:translate(-50%,-100%);cursor:pointer;animation:breathe 3.2s ease-in-out infinite}
 .pet img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px #000c)} .pet .nm{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:12px;white-space:nowrap;padding:0 8px;border-radius:8px;background:#000a;opacity:0;transition:opacity .2s} .pet:hover .nm{opacity:1}
 body.deco .pet{pointer-events:none;opacity:.55}
 @keyframes breathe{50%{transform:translate(-50%,-100%) scale(1.03,0.98)}}
 /* 손님(배우자) */
 #guest{position:absolute;left:820px;top:330px;width:200px;height:330px;display:none;pointer-events:none} #guest.on{display:block}
 #guest img{width:100%;height:100%;object-fit:contain;object-position:bottom}
 .bub{position:absolute;max-width:420px;padding:9px 13px;border-radius:14px;background:#140f0cee;border:1px solid #ffcf7a55;font-size:15px;line-height:1.45;box-shadow:0 6px 18px #000a;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none;z-index:6}
 .bub.on{opacity:1;transform:none}
 /* 아래 막대 */
 #bar{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;gap:10px;justify-content:center;padding:14px;background:linear-gradient(transparent,#000c)}
 .act{padding:8px 18px;border-radius:20px;border:1px solid #ffffff33;background:#0c0a08e8;cursor:pointer;font-size:14px;white-space:nowrap}
 .act:hover:not(:disabled){border-color:var(--gold);color:#ffe8c0;box-shadow:0 0 14px #ffcf7a44} .act.on{border-color:var(--gold);color:#ffe8c0;background:#2a1e0ce8} .act:disabled{opacity:.4;cursor:default}
 /* 고르기 판 */
 #panel{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;max-height:620px;overflow:auto;display:none;padding:18px 22px;border-radius:14px;background:#0f0b08f4;border:1px solid #ffcf7a77;box-shadow:0 0 50px #000}
 #panel.on{display:block} #panel h3{margin:0 0 4px;color:#ffe2b0;font-size:18px} #panel .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
 #panel .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
 .opt{padding:8px;border-radius:10px;border:1px solid #ffffff1f;background:#00000055;cursor:pointer;text-align:center;font-size:13px;line-height:1.3}
 .opt:hover{border-color:var(--gold);box-shadow:0 0 14px #ffcf7a33} .opt.cur{border-color:var(--gold);background:#2a1e0c} .opt .ic{height:72px;display:flex;align-items:center;justify-content:center} .opt .ic img{max-width:68px;max-height:68px}
 .opt .ic .gl{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#20160a;background:linear-gradient(135deg,#ffe2a8,#b07a2e)} .opt small{display:block;color:var(--dim);font-size:11px}
 #panel .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
 /* 대화 */
 #talk{position:absolute;z-index:10;right:24px;top:60px;bottom:80px;width:440px;display:none;flex-direction:column;border-radius:14px;background:#0d0a08e6;border:1px solid #ffcf7a55;box-shadow:0 0 30px #000c}
 #talk.on{display:flex} #talk h3{margin:0;padding:12px 16px;border-bottom:1px solid #ffffff14;font-size:15px;color:#ffe2b0;display:flex;justify-content:space-between;align-items:center}
 #log{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;user-select:text}
 .ln{max-width:88%;padding:7px 11px;border-radius:12px;font-size:14px;line-height:1.45} .ln.me{align-self:flex-end;background:#2a1e0c;border:1px solid #ffcf7a44} .ln.them{align-self:flex-start;background:#1a1218;border:1px solid #ff9ab844}
 #talk form{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff14} #talk input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid #ffffff33;background:#00000066}
 #toast{position:absolute;z-index:28;left:50%;top:40px;transform:translateX(-50%);padding:7px 18px;border-radius:18px;background:#0f0b08ee;border:1px solid #ffcf7a66;display:none;max-width:80%;font-size:14px} #toast.err{border-color:#ff6a7a}
 #door{position:absolute;inset:0;z-index:20;background:#000;opacity:1;pointer-events:none;transition:opacity 1.2s}
</style></head>
<body>
<div id="drag"></div><button id="x" type="button">✕</button>
<div id="stage">
 <svg id="scene" viewBox="0 0 1600 900"></svg><div id="artbg"></div>
 <div id="tank"></div><button id="safe" type="button"><i class="dial"></i><i class="hd"></i></button><div id="slots"></div><div id="pets"></div><div id="guest"></div><div id="bubs"></div><div id="glow"></div>
 <div id="bar"></div><div id="panel"></div><div id="talk"></div><div id="toast"></div><div id="door"></div>
</div>
<script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><script src="vault-ui.js"></script>
<script>
 const L = (ko, en) => (window.SLLMI18n && window.SLLMI18n.pick ? window.SLLMI18n.pick(ko, en) : ko);
 const $ = (id) => document.getElementById(id);
 const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
 const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
 let ART = false, S = null, deco = false, picking = null, inviting = false, playing = 0;
 // 자리(무대 1600×900): 02_침실_그림_의뢰서.md 2번 표(가로·세로 %)를 옮김. [가운데 x, 가운데 y, 너비, 높이]
 const SPOT0 = {
  bed: [1040, 560, 600, 400], floorA: [600, 690, 210, 220], cornerB: [1490, 590, 190, 330], rug: [800, 812, 300, 70], ceiling: [800, 46, 200, 70], window: [640, 250, 340, 330],
  wall1: [880, 175, 130, 150], wall2: [1040, 165, 150, 170], wall3: [1200, 175, 130, 150],
  shelf1: [720, 560, 90, 90], shelf2: [160, 190, 100, 80], shelf3: [280, 190, 100, 80], shelf4: [400, 190, 100, 80],
 };
 const PET_AT0 = [[740, 840], [860, 850], [980, 838]];
 // 그림 침실(2026-10-31 받은 8장, 1672×941 → 무대 1600×900): 실제 배경에 맞춘 자리. 아이콘(진열용 그림)은 가운데 기준 [x, y, 너비, 높이].
 const SPOT_ART = {
  bed: [1196, 520, 600, 300], floorA: [520, 700, 230, 220], cornerB: [1515, 600, 170, 300], rug: [1050, 800, 600, 110], ceiling: [800, 50, 260, 80], window: [668, 290, 460, 360],
  wall1: [1100, 255, 90, 110], wall2: [1200, 245, 110, 140], wall3: [1300, 255, 90, 110],
  shelf1: [835, 640, 70, 70], shelf2: [80, 232, 60, 60], shelf3: [150, 232, 60, 60], shelf4: [220, 232, 60, 60],
 };
 // 방에 세우는 그림(store/room/<id>.png): [가운데 x, 기준선 y, 너비, 'b' 바닥선 · 't' 천장]. 그림은 아래(천장등은 위) 여백을 정리해 둔 것.
 const ROOM_AT = { bed: [1196, 670, 622, 'b'], floorA: [520, 812, 225, 'b'], cornerB: [1500, 768, 190, 'b'], rug: [1050, 862, 1060, 'b'], ceiling: [800, 0, 300, 't'], window: [668, 96, 480, 't'] };
 const SLOT_Z = { rug: 1, window: 1, wall: 1, bed: 2, floor: 3, corner: 3, shelf: 4, ceiling: 4 };
 const PET_ART = [[770, 838], [1010, 852], [1250, 838]];
 let SPOT = SPOT0, PET_AT = PET_AT0;
 // 성향별 색(앱이 그린 방): [벽, 바닥, 침대, 강조]
 const PAL = { authoritarian: ['#2a0e12', '#160a08', '#6a1622', '#ffcf7a'], egalitarian: ['#2a2218', '#18120c', '#c8b89a', '#ffe2a8'], xenophile: ['#26142a', '#140c16', '#7a3a6a', '#ff9ab8'], xenophobe: ['#121a22', '#0a0e14', '#2e3e50', '#9fc4e8'],
  militarist: ['#1a1c1a', '#0e100e', '#3a4030', '#c8d090'], pacifist: ['#1a2630', '#0e161c', '#d8e8f0', '#bfeaff'], spiritualist: ['#20142e', '#120c1a', '#4a2a6a', '#e0b8ff'], materialist: ['#0e1e22', '#081214', '#24484e', '#7fe6ff'] };
 const toast = (t, bad) => { const m = $('toast'); m.textContent = t || ''; m.className = bad ? 'err' : ''; m.style.display = t ? 'block' : 'none'; if (t) setTimeout(() => { if (m.textContent === t) m.style.display = 'none'; }, 4200); };
 const call = async (p) => { const r = await p; if (r && r.state) S = r.state; if (r && !r.ok && r.error) toast(r.error, true); return r || {}; };
 function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('stage').style.transform = `translate(${-800 * s}px,${-450 * s}px) scale(${s})`; }
 addEventListener('resize', fit); fit();
 $('stage').addEventListener('scroll', (e) => { e.target.scrollTop = 0; e.target.scrollLeft = 0; });
 const glyph = (name) => h('div', 'gl', String(name || '?').trim().charAt(0));

 // ---- 앱이 그린 밤 침실(그림이 없을 때)
 function drawScene() {
  const bedItem = !!(S && S.slots && S.slots.find((x) => x.id === 'bed' && x.item)), [wall, floor, bed, acc] = PAL[(S && S.theme) || 'authoritarian'] || PAL.authoritarian;
  $('scene').innerHTML = `<defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wall}"/><stop offset="1" stop-color="#000"/></linearGradient>
   <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${floor}"/><stop offset="1" stop-color="#000"/></linearGradient>
   <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#1a1430"/></linearGradient>
   <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8aa0" stop-opacity=".55"/><stop offset="1" stop-color="#06283a" stop-opacity=".9"/></linearGradient>
   <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${acc}" stop-opacity=".35"/><stop offset="1" stop-color="${acc}" stop-opacity="0"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="6"/></filter></defs>
   <rect width="1600" height="900" fill="url(#w)"/><path d="M0 620 L1600 620 L1600 900 L0 900Z" fill="url(#f)"/>
   <rect x="470" y="85" width="340" height="330" rx="8" fill="url(#sky)" stroke="${acc}" stroke-opacity=".5" stroke-width="5"/>
   ${Array.from({ length: 40 }, (_, i) => `<circle cx="${480 + ((i * 97) % 320)}" cy="${95 + ((i * 53) % 200)}" r="${i % 5 ? 1 : 1.8}" fill="#fff" opacity=".7"/>`).join('')}
   <g fill="${acc}" opacity=".55">${Array.from({ length: 14 }, (_, i) => `<rect x="${482 + i * 23}" y="${300 + ((i * 37) % 80)}" width="16" height="${115 - ((i * 37) % 80)}"/>`).join('')}</g>
   <path d="M640 85 V415 M470 250 H810" stroke="${acc}" stroke-opacity=".35" stroke-width="3"/>
   <rect x="80" y="230" width="400" height="310" rx="8" fill="#000" stroke="${acc}" stroke-opacity=".5" stroke-width="6"/><rect x="96" y="250" width="368" height="270" fill="url(#wat)"/>
   <path d="M96 500 Q180 480 260 500 T464 495 V520 H96Z" fill="#c8b07a" opacity=".55"/>
   ${[140, 200, 380, 420].map((x, i) => `<path d="M${x} 505 q${i % 2 ? 12 : -10} -50 0 -${80 + i * 12}" stroke="#2a8a4a" stroke-width="5" fill="none" opacity=".7"/>`).join('')}
   <rect x="80" y="214" width="400" height="10" fill="${acc}" opacity=".35"/>
   <rect x="96" y="220" width="368" height="8" fill="${acc}" opacity=".25"/>
   <circle cx="800" cy="40" r="120" fill="url(#lamp)"/>
   ${bedItem ? '' : `<path d="M760 420 H1320 V470 H760Z" fill="${bed}" opacity=".9"/><rect x="760" y="460" width="560" height="200" rx="10" fill="${bed}"/><rect x="740" y="640" width="600" height="40" rx="8" fill="#000" opacity=".5"/>
   <rect x="780" y="480" width="200" height="60" rx="18" fill="#fff" opacity=".18"/><rect x="1100" y="480" width="200" height="60" rx="18" fill="#fff" opacity=".18"/><path d="M760 560 H1320 V660 H760Z" fill="#000" opacity=".18"/>`}
   <rect x="660" y="580" width="110" height="80" fill="#000" opacity=".35" stroke="${acc}" stroke-opacity=".3"/>
   <ellipse cx="860" cy="830" rx="260" ry="50" fill="${acc}" opacity=".12"/><ellipse cx="860" cy="830" rx="230" ry="40" fill="none" stroke="${acc}" stroke-opacity=".3" stroke-width="2"/>
   <circle cx="715" cy="560" r="60" fill="url(#lamp)" filter="url(#bl)"/>`;
 }

 // 2026-10-31 사용자 결정: 산 가구는 침실에 놓지 않음(개인실 버프 용도만 — 가구 편의). 침실은 완성 그림(17_침실_완성_그림_의뢰서) 오기 전까지 기본 침대만 얹음.
 function drawBed() {
  const box = $('slots'); box.textContent = ''; deco = false; document.body.classList.remove('deco');
  const ra = ROOM_AT.bed; if (!ART || !S.art.bed || S.art.full) return;
  const d = h('div', 'slot room bed'); Object.assign(d.style, { left: ra[0] + 'px', width: ra[2] + 'px', height: 'auto', top: 'auto', bottom: (900 - ra[1]) + 'px', zIndex: 2, pointerEvents: 'none' }); const im = h('img', 'rm'); im.src = S.art.bed; d.append(im); box.append(d);
 }
 function openComfort() {
  const c = S.comfort; if (!c) return; picking = null; inviting = false; const p = $('panel'); p.textContent = ''; p.classList.add('on');
