<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Black Market Alley</title>
<!-- 암시장 골목(2026-10-30). 앱: src/features/blackmarket-app.ts · 자료: src/blackmarket.ts. 입구: 외출 지도 → 암시장 골목(혼자, 후드).
     몰입형(선술집과 같은 방식): 1600×900 무대. 비 젖은 골목(그림 bg 또는 앱이 그린 장면), 노점을 누르면 다가가 상인이 말풍선으로 말함,
     물건은 노점 앞 천 위에 펼쳐짐 → 흥정창(값 부르기). 정보상은 궁정 음모 단서·감정. 순찰 열기는 드론·경광등으로, 단속이면 사이렌.
     그림 자리(12_암시장_그림_의뢰서.md): blackmarket/bg, blackmarket/merchants/(stall), blackmarket/items/(id) — webp/png. 노점 자리(SPOT)는 그림이 오면 맞춤.
     문구는 L(한, 영)만(언어 팩 호환). -->
<style>
 :root{--green:#5cf2a0;--cyan:#33e6ff;--amber:#ffb347;--red:#ff4d5e;--blue:#3a7bff;--text:#e8ecf2;--dim:#8e98a8}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;color:var(--text);font:15px/1.5 "Malgun Gothic","Segoe UI",sans-serif;overflow:hidden;user-select:none}
 button,input{font:inherit;color:var(--text)}
 #drag{position:absolute;z-index:30;left:0;right:0;top:0;height:30px;-webkit-app-region:drag}
 #hud{position:absolute;z-index:31;right:10px;top:6px;display:flex;gap:10px;align-items:center;-webkit-app-region:no-drag}
 #hud .v{font-size:12px;color:var(--dim);padding:2px 9px;border-radius:10px;background:#0008} #hud .v b{color:var(--amber)}
 #heatI{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:2px 9px;border-radius:10px;background:#0008} #heatI .m{width:70px;height:4px;border-radius:2px;background:#ffffff1a;overflow:hidden} #heatI .m i{display:block;height:100%;transition:width .6s,background .6s}
 #x{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer} #x:hover{color:#fff}
 #stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#05070a}
 #cam{position:absolute;inset:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
 #scene,#artbg{position:absolute;inset:0;width:100%;height:100%} #artbg{background-size:cover;background-position:center;display:none}
 .fx{position:absolute;inset:0;pointer-events:none}
 #merch .m{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:center top;pointer-events:none;-webkit-mask-image:linear-gradient(#000 var(--cut,62%),transparent calc(var(--cut,62%) + 8%));filter:drop-shadow(0 0 10px #000c) brightness(.88)} /* 그림 속 노점 뒤에 선 상인(배경 지운 그림) */
 #rain{opacity:.25;background:repeating-linear-gradient(100deg,transparent 0 18px,#a9d8ff66 18px 19px,transparent 19px 41px);background-size:100% 260px;animation:rain .45s linear infinite} @keyframes rain{to{background-position:0 260px}}
 #vig{background:radial-gradient(ellipse at 50% 55%,transparent 45%,#000d 100%)}
 #police{opacity:0;transition:opacity 1s;background:linear-gradient(90deg,#ff1a3a55,transparent 25%,transparent 75%,#2a5cff55)} #police.on{animation:pol .8s steps(2) infinite} @keyframes pol{50%{background:linear-gradient(90deg,#2a5cff55,transparent 25%,transparent 75%,#ff1a3a55)}}
 #beam{position:absolute;top:-200px;left:-400px;width:360px;height:1300px;background:linear-gradient(#e8f4ff00,#e8f4ff22 30%,#e8f4ff10);transform:rotate(18deg);filter:blur(10px);pointer-events:none;opacity:0}
 #beam.go{animation:sweep 4.5s ease-in-out} @keyframes sweep{0%{left:-400px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:1700px;opacity:0}}
 .walker{position:absolute;bottom:170px;width:60px;height:150px;pointer-events:none;opacity:.8;animation:walk 26s linear infinite} .walker svg{width:100%;height:100%} @keyframes walk{from{left:-80px}to{left:1680px}}
 .spot{position:absolute;transform:translate(-50%,-50%);width:300px;height:260px;cursor:pointer;border-radius:40%}
 .spot .glow{position:absolute;inset:30px;border-radius:40%;transition:box-shadow .3s,background .3s} .spot:hover .glow{box-shadow:0 0 34px 8px #5cf2a044;background:#5cf2a00a}
 .spot .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;font-size:13px;padding:2px 10px;border-radius:10px;background:#000b;border:1px solid #5cf2a066;color:#c8ffe2;opacity:0;transition:opacity .3s} .spot:hover .tag,.spot.near .tag{opacity:1} .spot.edge .tag{left:auto;right:30%;transform:none}
 .bub{position:absolute;max-width:380px;padding:9px 13px;border-radius:14px;background:#0a0e14ee;border:1px solid #5cf2a055;font-size:15px;line-height:1.4;box-shadow:0 6px 18px #000a;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}
 .bub.on{opacity:1;transform:none} .bub::after{content:'';position:absolute;left:30px;bottom:-9px;border:9px solid transparent;border-top-color:#0a0e14ee;border-bottom:0}
 #ring{position:absolute;display:none;gap:10px;transform:translate(-50%,0)} #ring.on{display:flex}
 .act{padding:8px 16px;border-radius:20px;border:1px solid #ffffff33;background:#070a10e8;cursor:pointer;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px #000c}
 .act:hover:not(:disabled){border-color:var(--green);color:#c8ffe2;box-shadow:0 0 14px #5cf2a055} .act:disabled{opacity:.4;cursor:default} .act.hot{border-color:var(--amber);color:#ffe2b0}
 /* 천 위의 물건 */
 #tray{position:absolute;left:60px;right:60px;bottom:24px;z-index:7;display:none;padding:16px 18px 14px;border-radius:12px;background:linear-gradient(#2a1a10f0,#1a1008f4);border:1px solid #8a5a2a;box-shadow:0 -10px 30px #000c}
 #tray.on{display:block} #tray h3{margin:0 0 10px;font-size:15px;color:#ffd9a8;display:flex;justify-content:space-between}
 #tray .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
 .ware{flex:none;width:150px;padding:8px;border-radius:8px;background:#00000055;border:1px solid #ffffff1a;cursor:pointer;text-align:center;position:relative}
 .ware:hover{border-color:var(--amber);box-shadow:0 0 14px #ffb34744} .ware.off{opacity:.4} .ware .ic{height:90px;display:flex;align-items:center;justify-content:center} .ware .ic img{max-width:84px;max-height:84px}
 .ware .gl{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#06100a;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 16px var(--c1)}
 .ware .nm{font-size:13px;font-weight:700;line-height:1.3;min-height:34px} .ware .tg{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:4px;background:#ffe2b0;color:#2a1a08;font-size:12px;font-weight:700;transform:rotate(-3deg)}
 /* 흥정 */
 #deal{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:620px;display:none;padding:18px 22px;border-radius:12px;background:#0a0d12f4;border:1px solid var(--amber);box-shadow:0 0 40px #000}
 #deal.on{display:block} #deal .top{display:flex;gap:16px} #deal .big{width:150px;height:150px;flex:none;border-radius:10px;background:#00000066;display:flex;align-items:center;justify-content:center} #deal .big img{max-width:140px;max-height:140px} #deal .big .gl{width:100px;height:100px;font-size:40px}
 #deal h2{margin:0 0 6px;color:#ffe2b0;font-size:20px} #deal .ask{font-size:16px;margin:8px 0} #deal .ask b{color:var(--amber);font-size:22px} #deal .ask s{color:var(--dim);margin-left:8px}
 #deal .pat{color:var(--dim);font-size:12px} #deal .pat i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-left:3px} #deal .pat i.no{background:#ffffff22}
 #deal .reply{min-height:44px;margin:10px 0;padding:8px 12px;border-radius:8px;background:#ffffff08;border-left:3px solid var(--green);font-size:15px}
 #deal .offer{display:flex;gap:8px;align-items:center;flex-wrap:wrap} #deal input{width:130px;padding:7px 10px;border-radius:6px;border:1px solid #ffffff33;background:#00000066;font-size:16px}
 #deal .q,#deal .go,#deal .cl{padding:6px 12px;border-radius:6px;border:1px solid #ffffff33;background:#101620;cursor:pointer} #deal .go{border-color:var(--amber);color:#ffe2b0;font-weight:700} #deal .q:hover,#deal .cl:hover{border-color:var(--green)}
 #deal .cl{float:right}
 /* 단속 */
 #raid{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;background:#000c}
 #raid.on{display:flex;animation:siren .5s steps(2) 10} @keyframes siren{50%{background:#001a66cc}} #raid h2{margin:0;font-size:40px;color:#ff6a7a;text-shadow:0 0 18px #ff2a40} #raid p{max-width:780px;margin:0;font-size:18px}
 #raid button,.leave{padding:9px 22px;border-radius:22px;border:1px solid var(--green);background:#0a2016;color:#c8ffe2;cursor:pointer;font-size:15px}
 #gate{position:absolute;inset:0;z-index:22;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000c;text-align:center} #gate.on{display:flex} #gate p{max-width:640px}
 #toast{position:absolute;z-index:28;left:50%;top:40px;transform:translateX(-50%);padding:7px 18px;border-radius:18px;background:#0a0d12ee;border:1px solid #5cf2a066;display:none;max-width:80%;font-size:14px} #toast.err{border-color:var(--red)}
 #exitBtn{position:absolute;left:24px;bottom:22px;z-index:6}
 #door{position:absolute;inset:0;z-index:20;background:#000;opacity:1;pointer-events:none;transition:opacity 1.2s}
</style></head>
<body>
<div id="drag"></div>
<div id="hud"><span id="heatI"></span><span class="v" id="vault"></span><button id="x" type="button">✕</button></div>
<div id="stage">
 <div id="cam"><svg id="scene" viewBox="0 0 1600 900"></svg><div id="artbg"></div><div id="merch"></div><div id="walkers"></div><div id="spots"></div><div id="bubs"></div><div id="ring"></div></div>
 <div id="beam"></div><div class="fx" id="rain"></div><div class="fx" id="vig"></div><div class="fx" id="police"></div>
 <button class="leave" id="exitBtn" type="button"></button>
 <div id="tray"></div><div id="deal"></div><div id="gate"></div><div id="raid"></div><div id="toast"></div><div id="door"></div>
</div>
<script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script>
<script>
 const L = (ko, en) => (window.SLLMI18n && window.SLLMI18n.pick ? window.SLLMI18n.pick(ko, en) : ko);
 const $ = (id) => document.getElementById(id);
 const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
 const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
 const fmt = (n) => Math.round(n).toLocaleString();
 let S = null, focus = null, tray = null, dealId = null, playing = 0, lastHeat = 0;
 // 노점 자리(무대 1600×900). 그림(bg)이 오면 그림 속 노점에 맞춰 고침.
 const DRAWN_SPOT = { creatures: [360, 560], smuggler: [880, 520], broker: [1300, 470] };
 let SPOT = DRAWN_SPOT;
 // 그림(bg 1920×1080 → 무대 1600×900) 속 노점 자리: 왼쪽 초록 우리 · 가운데 방수포 아래 상자 · 오른쪽 문간
 const ART_SPOT = { creatures: [250, 440], smuggler: [870, 430], broker: [1425, 400] };
 // 상인 배경 지운 그림: [가운데 x, 그림 위 y, 높이, 보이는 비율(아래는 노점에 가려짐)]
 const MERCH_AT = { creatures: [400, 250, 300, '64%'], smuggler: [790, 300, 220, '66%'], broker: [1428, 175, 330, '70%'] };
 // 그림일 때 말풍선 자리(상인 머리 옆)
 const ART_BUB = { creatures: [560, 250], smuggler: [880, 220], broker: [1000, 150] };
 const COL = { creatures: ['#5cf2a0', '#1f8a5a'], smuggler: ['#ffb347', '#a8641a'] };
 const toast = (t, bad) => { const m = $('toast'); m.textContent = t || ''; m.className = bad ? 'err' : ''; m.style.display = t ? 'block' : 'none'; if (t) setTimeout(() => { if (m.textContent === t) m.style.display = 'none'; }, 4200); };
 const call = async (p) => { const r = await p; if (r && r.state) S = r.state; if (r && !r.ok && r.error) toast(r.error, true); return r || {}; };
 function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('stage').style.transform = `translate(${-800 * s}px,${-450 * s}px) scale(${s})`; }
 addEventListener('resize', fit); fit();
 $('stage').addEventListener('scroll', (e) => { e.target.scrollTop = 0; e.target.scrollLeft = 0; }); // 입력칸 포커스가 무대를 밀어 올리지 않게

 // ---- 앱이 그린 골목
 const hooded = (x, y, s, rim) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-36 0 C-38 -70 -26 -104 0 -112 C26 -104 38 -70 36 0 Z" fill="#06080c"/><path d="M-26 -96 C-26 -140 26 -140 26 -96 C26 -84 14 -78 0 -78 C-14 -78 -26 -84 -26 -96 Z" fill="#06080c"/><path d="M-26 -96 C-26 -140 26 -140 26 -96" stroke="${rim}" stroke-width="2.5" fill="none" opacity=".8"/></g>`;
 function drawScene() {
  let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#1a1428"/></linearGradient>
   <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1218"/><stop offset="1" stop-color="#030406"/></linearGradient>
   <filter id="gl"><feGaussianBlur stdDeviation="4"/></filter><filter id="bl"><feGaussianBlur stdDeviation="10"/></filter>
   <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb34766"/><stop offset="1" stop-color="#ffb34700"/></radialGradient>
   <radialGradient id="glw" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5cf2a055"/><stop offset="1" stop-color="#5cf2a000"/></radialGradient></defs>
   <rect width="1600" height="900" fill="url(#sky)"/>
   <g filter="url(#bl)" opacity=".7"><circle cx="760" cy="300" r="40" fill="#ff3fa4"/><circle cx="840" cy="340" r="30" fill="#33e6ff"/><circle cx="800" cy="250" r="22" fill="#ffb347"/></g>
   <path d="M0 0 L620 250 L620 620 L0 900 Z" fill="#0a0d14"/><path d="M1600 0 L980 250 L980 620 L1600 900 Z" fill="#0b0e16"/>
   <path d="M620 620 L980 620 L1600 900 L0 900 Z" fill="url(#gnd)"/>
   <g stroke="#ffffff0a">${Array.from({ length: 14 }, (_, i) => `<line x1="${620 + i * 27.7}" y1="620" x2="${-200 + i * 154}" y2="900"/>`).join('')}</g>
   <g opacity=".5" filter="url(#bl)"><rect x="300" y="740" width="60" height="140" fill="#5cf2a0"/><rect x="860" y="720" width="50" height="160" fill="#ffb347"/><rect x="1260" y="700" width="40" height="180" fill="#33e6ff"/><rect x="760" y="660" width="30" height="120" fill="#ff3fa4"/></g>
   <g stroke="#1c2230" stroke-width="6" fill="none"><path d="M0 120 L620 330"/><path d="M0 300 L620 420"/><path d="M1600 140 L980 330"/><path d="M1600 340 L980 430"/></g>
   <path d="M120 0 C 300 140 500 150 700 120 C 900 90 1100 160 1500 0" stroke="#222a38" stroke-width="2" fill="none"/>
   ${[[230, 70], [470, 95], [690, 118], [950, 112], [1200, 80]].map(([x, y]) => `<circle cx="${x}" cy="${y + 20}" r="40" fill="url(#lamp)"/><rect x="${x - 9}" y="${y}" width="18" height="26" rx="6" fill="#ffb347" opacity=".85"/>`).join('')}
   <g><rect x="90" y="190" width="120" height="70" rx="6" fill="none" stroke="#5cf2a0" stroke-width="4" filter="url(#gl)"/><rect x="90" y="190" width="120" height="70" rx="6" fill="none" stroke="#d6ffe9" stroke-width="1.5"/>
    <path d="M1380 170 l40 -40 l40 40 l-40 40 z" fill="none" stroke="#ff3fa4" stroke-width="4" filter="url(#gl)"/><path d="M1380 170 l40 -40 l40 40 l-40 40 z" fill="none" stroke="#ffd6ee" stroke-width="1.5"/>
    <circle cx="1120" cy="250" r="26" fill="none" stroke="#33e6ff" stroke-width="4" filter="url(#gl)"/><circle cx="1120" cy="250" r="26" fill="none" stroke="#dffbff" stroke-width="1.5"/></g>
   <g opacity=".5">${[[520, 520], [560, 480], [1050, 500]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="30" fill="#c8d0dc" opacity=".08" filter="url(#bl)"/>`).join('')}</g>`;
  // 생물상: 빛나는 우리들
  { const [x, y] = SPOT.creatures; s += `<circle cx="${x}" cy="${y}" r="190" fill="url(#glw)"/><path d="M${x - 170} ${y - 120} L${x + 170} ${y - 150} L${x + 160} ${y - 110} L${x - 160} ${y - 80} Z" fill="#183a2a"/>
    ${[[-120, -40], [-40, -50], [40, -40], [-80, 20], [10, 20]].map(([dx, dy]) => `<rect x="${x + dx}" y="${y + dy}" width="64" height="54" rx="4" fill="#0a1a12" stroke="#5cf2a0" stroke-width="2" opacity=".9"/><circle cx="${x + dx + 32}" cy="${y + dy + 30}" r="9" fill="#5cf2a0" opacity=".6"/>`).join('')}
    ${hooded(x + 110, y + 70, 1, '#5cf2a0')}<rect x="${x - 150}" y="${y + 74}" width="300" height="16" fill="#0a1a12"/>`; }
  // 밀수상: 상자와 방수포
  { const [x, y] = SPOT.smuggler; s += `<path d="M${x - 180} ${y - 130} L${x + 180} ${y - 150} L${x + 170} ${y - 100} L${x - 170} ${y - 90} Z" fill="#3a2410"/>
    ${[[-150, -10, 90, 70], [-50, 0, 70, 60], [30, -30, 110, 90], [-110, -70, 60, 50]].map(([dx, dy, w, hh]) => `<rect x="${x + dx}" y="${y + dy}" width="${w}" height="${hh}" fill="#2a1c10" stroke="#ffb347" stroke-width="1.5" opacity=".9"/>`).join('')}
    <circle cx="${x - 20}" cy="${y - 50}" r="60" fill="url(#lamp)"/>${hooded(x + 150, y + 90, 1.05, '#ffb347')}`; }
  // 정보상: 문간의 홀로그램 얼굴
  { const [x, y] = SPOT.broker; s += `<rect x="${x - 70}" y="${y - 170}" width="140" height="260" fill="#04060a" stroke="#1c2433" stroke-width="6"/>${hooded(x, y + 80, 1.15, '#33e6ff')}
    <ellipse cx="${x}" cy="${y - 52}" rx="22" ry="26" fill="#33e6ff" opacity=".25" filter="url(#gl)"/><g stroke="#33e6ff" opacity=".7">${Array.from({ length: 6 }, (_, i) => `<line x1="${x - 20}" y1="${y - 72 + i * 8}" x2="${x + 20}" y2="${y - 72 + i * 8}"/>`).join('')}</g>`; }
  $('scene').innerHTML = s;
  const wk = $('walkers'); wk.innerHTML = ''; [0, 11].forEach((d, i) => { const w = h('div', 'walker'); w.style.animationDelay = `-${d}s`; w.style.animationDuration = `${24 + i * 9}s`; w.innerHTML = `<svg viewBox="-40 -150 80 150">${hooded(0, 0, 1, i ? '#ff3fa4' : '#33e6ff')}</svg>`; wk.append(w); });
 }
 drawScene();
 setInterval(() => { if (!S || !S.ready || S.raided) return; const p = (S.heat || 0) / S.heatMax; if (Math.random() < 0.15 + p * 0.6) { const b = $('beam'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); } }, 6000);

 function drawHeat() {
  const e = $('heatI'); e.textContent = ''; if (!S || !S.ready) return; const p = S.heat / S.heatMax, c = p < 0.4 ? '#8e98a8' : p < 0.6 ? '#ffb347' : '#ff4d5e';
  e.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="12" cy="10" rx="8" ry="3" fill="none" stroke="${c}" stroke-width="2"/><path d="M4 10 L2 7 M20 10 L22 7" stroke="${c}" stroke-width="2"/><path d="M12 13 L8 22 M12 13 L16 22" stroke="${c}" stroke-width="1" opacity=".6"/></svg>`;
  const m = h('span', 'm'), i = h('i'); i.style.width = Math.round(p * 100) + '%'; i.style.background = c; m.append(i); e.append(document.createTextNode(L('순찰', 'Patrol')), m);
  e.title = L('흥정하고 사고 묻고 다닐수록 순찰 드론이 꼬입니다. 60부터는 언제든 단속이 올 수 있고, 다 차면 반드시 옵니다.', 'The more you haggle, buy and ask around, the more patrol drones gather. From 60 a raid can come any time; when full, it will.');
  $('police').style.opacity = p >= 0.6 ? 0.9 : 0; $('police').classList.toggle('on', p >= 0.6);
  if (S.heat > lastHeat && lastHeat < 40 && S.heat >= 40) toast(L('머리 위로 순찰 드론이 낮게 지나갑니다.', 'A patrol drone glides low overhead.'));

 function drawMerch() {

 function drawSpots() {
  const sp = $('spots'); sp.textContent = ''; if (!S.ready || S.banned || S.raided) return;

 function camTo(k) { const c = $('cam'); if (!k) { c.style.transform = ''; return; } const [x, y] = SPOT[k], z = 1.4; const tx = Math.max(-(1600 * z - 1600), Math.min(0, 800 - x * z)), ty = Math.max(-(900 * z - 900), Math.min(0, 430 - y * z)); c.style.transform = `translate(${tx}px,${ty}px) scale(${z})`; }

 $('stage').addEventListener('click', (e) => { if (focus && !e.target.closest('.act,.spot,#ring,#tray,#deal,#exitBtn,#hud,#raid,#gate')) back(); });
 async function say(text) {
  const box = $('bubs'), tk = ++playing; box.textContent = ''; if (!focus || !text) return; const [x, y] = SPOT[focus], ab = S.art.bg && ART_BUB[focus], b = h('div', 'bub'); b.style.left = (ab ? ab[0] : x + (focus === 'broker' ? -440 : -60)) + 'px'; b.style.top = (ab ? ab[1] : y - 250) + 'px'; box.append(b); await sleep(30); b.classList.add('on');

 function drawRing() {

 }
 const glyph = (it) => { const g = h('div', 'gl', it.name.trim().charAt(0)); const [c1, c2] = COL[it.stall]; g.style.setProperty('--c1', c1); g.style.setProperty('--c2', c2); return g; };
 function drawTray() {

   if (!list.length) row.append(h('div', '', L('감정할 물건이 없습니다.', 'Nothing to appraise.')));
   for (const o of list) { const it = S.items.find((x) => x.id === o.id); const w = h('div', 'ware'), ic = h('div', 'ic'); if (it && it.icon) { const im = h('img'); im.src = it.icon; ic.append(im); } else if (it) ic.append(glyph(it)); w.append(ic, h('div', 'nm', o.name), h('span', 'tg', o.on)); w.onclick = async () => { const r = await call(window.sllm.blackmarketAppraise(o.uid)); if (r.reply) say(r.reply); render(); }; row.append(w); }

  }
  const st = S.stalls.find((x) => x.id === tray); hd.append(document.createTextNode(tray === 'creatures' ? L(`${st.name} — 우리 속 (밀수 생물은 ${S.maxCreatures}마리까지, 지금 ${S.creatures})`, `${st.name} — in the cages (smuggled creatures: up to ${S.maxCreatures}, now ${S.creatures})`) : L(`${st.name} — 천 위에 펼친 물건`, `${st.name} — laid out on the cloth`)), cl); t.append(hd);
  const row = h('div', 'row'); for (const it of S.items.filter((x) => x.stall === tray)) { const w = h('div', 'ware' + (it.closed ? ' off' : '')), ic = h('div', 'ic'); if (it.icon) { const im = h('img'); im.src = it.icon; ic.append(im); } else ic.append(glyph(it)); w.append(ic, h('div', 'nm', it.name), h('span', 'tg', fmt(it.ask))); w.onclick = () => { dealId = it.id; drawDeal(); }; row.append(w); }
  t.append(row);
 }
 function drawDeal() {
  const d = $('deal'); d.textContent = ''; const it = dealId && S.items.find((x) => x.id === dealId); d.classList.toggle('on', !!it && !S.raided); if (!it || S.raided) return;
  const cl = h('button', 'cl', L('그만두기', 'Never mind')); cl.type = 'button'; cl.onclick = () => { dealId = null; drawDeal(); }; d.append(cl);
  const top = h('div', 'top'), big = h('div', 'big'); if (it.icon) { const im = h('img'); im.src = it.icon; big.append(im); } else big.append(glyph(it)); const info = h('div', ''); info.append(h('h2', '', it.name), h('div', '', it.about));
  const ask = h('div', 'ask'); ask.append(document.createTextNode(L('부르는 값 ', 'Asking ')), h('b', '', fmt(it.ask))); if (it.ask !== it.list) ask.append(h('s', '', fmt(it.list))); info.append(ask);
  const pat = h('div', 'pat', L('상인의 참을성', 'Patience')); for (let i = 0; i < 3; i++) pat.append(h('i', i < it.patience ? '' : 'no')); info.append(pat); top.append(big, info); d.append(top);
  const st = S.stalls.find((x) => x.id === it.stall); d.append(h('div', 'reply', st.greet));
  if (it.closed) { d.append(h('div', 'pat', L('오늘은 이 물건 흥정이 끝났습니다.', 'Haggling for this is over today.'))); return; }
  const of = h('div', 'offer'), inp = h('input'); inp.type = 'number'; inp.min = '1'; inp.value = String(Math.round(it.ask * 0.7));
  for (const [t, k] of [['-10%', 0.9], ['-25%', 0.75], ['-40%', 0.6]]) { const q = h('button', 'q', t); q.type = 'button'; q.onclick = () => { inp.value = String(Math.round(it.ask * k)); }; of.append(q); }
  const go = h('button', 'go', L('이 값에 하자', 'Offer this')); go.type = 'button';
  go.onclick = async () => { go.disabled = true; const r = await call(window.sllm.blackmarketOffer(it.id, Number(inp.value))); if (r.reply) say(r.reply); if (r.bought) { toast(L(`${r.bought}을(를) 손에 넣었습니다. 진짜인지는… 감정해 봐야 압니다.`, `You got the ${r.bought}. Genuine? Only an appraisal will tell.`)); dealId = null; } render(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') go.onclick(); };
  of.append(inp, go); d.append(of); setTimeout(() => inp.focus({ preventScroll: true }), 0);

 function drawGate() {
  const g = $('gate'); g.textContent = ''; const on = S.ready && S.banned && !S.raided; g.classList.toggle('on', on); if (!on) return;
  const b = h('button', 'leave', L('돌아가기', 'Go back')); b.type = 'button'; b.onclick = () => window.sllm.blackmarketClose(); g.append(h('p', '', S.bannedText), b);

 $('exitBtn').onclick = () => { toast(L('비 젖은 골목을 빠져나와 궁으로 돌아갑니다.', 'You slip out of the wet alley and head back to the palace.')); setTimeout(() => window.sllm.blackmarketClose(), 900); };
