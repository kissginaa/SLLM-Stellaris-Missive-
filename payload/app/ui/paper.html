 *{box-sizing:border-box}

 #sheet.unfold{animation:sllm-unfold .55s cubic-bezier(.2,.75,.25,1) both;transform-origin:50% 0}
 @keyframes sllm-unfold{0%{transform:perspective(1600px) rotateX(-78deg) scaleY(.35);opacity:.2;filter:brightness(.7)}55%{opacity:1}100%{transform:none;opacity:1;filter:none}}
